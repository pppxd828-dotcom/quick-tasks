
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專屬雜事追蹤管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; background-color: #f1f5f9; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="text-slate-800 min-h-screen">

<!-- 頂部導覽列 -->
<header class="bg-[#1e293b] text-white shadow-md sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-blue-500 p-1.5 rounded-lg">🛡️</div>
      <h1 class="text-lg font-bold tracking-wider">專屬雜事追蹤管理系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="userStatus" class="text-xs text-slate-300"></span>
      <button id="loginBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 transition">☁️ 雲端同步登入</button>
      <button id="logoutBtn" class="hidden px-4 py-2 rounded-md bg-slate-700 text-slate-200 text-sm font-bold hover:bg-slate-600 transition">登出</button>
      <button id="openModalBtn" class="hidden px-4 py-2 rounded-md bg-emerald-500 text-white text-sm font-bold hover:bg-emerald-600 transition shadow-sm">+ 新增案件</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 mt-6">
  
  <!-- 四大狀態卡片 (儀表板) -->
  <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div onclick="filterByDashboard('急件')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-500 text-2xl">🚨</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">今日急件</p>
        <p id="countUrgent" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('待處理')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 text-2xl">📥</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">待處理清單</p>
        <p id="countTodo" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('進行中')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-2xl">🏃</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">處理/盤點中</p>
        <p id="countDoing" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('卡關')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center text-purple-500 text-2xl">🤝</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">卡關/等回覆</p>
        <p id="countWaiting" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
  </section>

  <!-- 案件資料表區域 -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <div class="flex flex-col gap-3">
        <!-- 狀態篩選 (固定選項) -->
        <div class="flex items-center gap-3 flex-wrap">
          <span class="text-sm font-bold text-slate-600 bg-slate-200 px-2 py-1 rounded">狀態篩選</span>
          <label class="cursor-pointer flex items-center gap-1 text-sm text-slate-700 font-medium"><input type="checkbox" value="待處理" class="filter-status w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked onchange="applyFilter()"> 待處理</label>
          <label class="cursor-pointer flex items-center gap-1 text-sm text-slate-700 font-medium"><input type="checkbox" value="進行中" class="filter-status w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked onchange="applyFilter()"> 進行中</label>
          <label class="cursor-pointer flex items-center gap-1 text-sm text-slate-700 font-medium"><input type="checkbox" value="卡關" class="filter-status w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked onchange="applyFilter()"> 卡關</label>
          <label class="cursor-pointer flex items-center gap-1 text-sm text-slate-700 font-medium"><input type="checkbox" value="等回覆" class="filter-status w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked onchange="applyFilter()"> 等回覆</label>
          <label class="cursor-pointer flex items-center gap-1 text-sm text-slate-700 font-medium"><input type="checkbox" value="結案" class="filter-status w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked onchange="applyFilter()"> 結案</label>
        </div>
        <!-- 類別篩選 (將由 JavaScript 動態生成) -->
        <div class="flex items-center gap-3 flex-wrap" id="categoryFilterGroup">
          <span class="text-sm font-bold text-slate-600 bg-slate-200 px-2 py-1 rounded">類別篩選</span>
          <span class="text-sm text-slate-400">載入中...</span>
        </div>
      </div>
      <button class="px-3 py-1.5 text-sm font-bold text-emerald-600 bg-emerald-50 rounded-md hover:bg-emerald-100">📥 匯出 Excel</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200">
            <th class="px-6 py-4 font-bold">狀態</th>
            <th class="px-6 py-4 font-bold">專案類別</th>
            <th class="px-6 py-4 font-bold">聯絡人</th>
            <th class="px-6 py-4 font-bold">任務來源</th>
            <th class="px-6 py-4 font-semibold text-left">任務摘要</th>
            <th class="px-6 py-4 font-semibold text-left">標籤</th>
            <th class="px-6 py-4 font-bold">死線</th>
            <th class="px-6 py-4 font-bold">最後更新</th>
            <th class="px-6 py-4 font-semibold text-center">操作</th>
          </tr>
        </thead>
        <tbody id="taskTableBody" class="text-sm divide-y divide-slate-100">
          <tr>
            <td colspan="6" class="px-6 py-10 text-center text-slate-400">請先登入以載入資料...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- 新增案件 Modal 表單 -->
<div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center">
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h2 class="text-lg font-bold text-slate-800">新增追蹤案件</h2>
      <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
    </div>
    <div class="p-6 grid grid-cols-2 gap-4">
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">專案類別 (來自 Google Sheets)</label>
        <select id="categorySelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">聯絡人 (來自 Google Sheets)</label>
        <select id="contactSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務來源 (來自 Google Sheets)</label>
        <select id="taskSource" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
       </select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務摘要</label>
        <input type="text" id="taskTitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-blue-500" placeholder="一句話描述這個任務...">
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-500 mb-1">詳細說明與網址</label>
        <textarea id="taskDetails" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 resize-none" placeholder="貼上表單連結、錯誤訊息或備註..."></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
      <button id="cancelBtn" class="px-4 py-2 rounded-lg text-slate-600 font-bold hover:bg-slate-200 text-sm">取消</button>
      <button id="saveTaskBtn" class="px-5 py-2 rounded-lg bg-blue-600 text-white font-bold hover:bg-blue-700 text-sm shadow-sm">儲存案件</button>
    </div>
  </div>
</div>

  <!-- 案件處理與紀錄 Modal -->
<div id="taskDetailModal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- 標題區 -->
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="font-bold text-lg text-slate-800">📝 案件處理與紀錄</h3>
      <button onclick="closeTaskDetailModal()" class="text-slate-400 hover:text-rose-500 transition text-xl font-bold">&times;</button>
    </div>
    
    <!-- 內容區 -->
    <div class="p-6 overflow-y-auto flex-1 space-y-5">
      <!-- 狀態修改 -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">更新案件狀態</label>
        <select id="detailStatus" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 font-medium">
          <option value="待處理">待處理</option>
          <option value="進行中">進行中</option>
          <option value="等回覆">等回覆</option>
          <option value="卡關">卡關</option>
          <option value="結案">結案</option>
        </select>
      </div>

      <!-- 標籤修改 -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">🏷️ 案件標籤 (多個標籤請用半形逗號 , 分隔)</label>
        <input type="text" id="detailTags" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400" placeholder="例如：VIP, 需要報價, 跨部門">
      </div>
      
      <!-- 執行說明 -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">新增執行說明 (選填)</label>
        <textarea id="detailNote" rows="3" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400" placeholder="請描述目前的進度、遇到的問題，或與客戶確認的結果..."></textarea>
      </div>

      <hr class="border-slate-100">

      <!-- 歷史歷程 LOG -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">處理歷程 (History Log)</label>
        <!-- 使用 pre-wrap 讓紀錄可以自動換行並保留格式 -->
        <div id="detailLog" class="bg-slate-50 border border-slate-100 rounded-lg p-4 text-xs text-slate-600 whitespace-pre-wrap h-48 overflow-y-auto font-mono leading-relaxed">
          <!-- 歷程紀錄會顯示在這裡 -->
        </div>
      </div>
    </div>

    <!-- 按鈕區 -->
    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3">
      <button onclick="closeTaskDetailModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-lg transition font-medium">取消</button>
      <button id="saveDetailBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium shadow-sm">儲存變更</button>
    </div>
    
  </div>
</div>

<script>
/* === 請換成你的 Client ID === */
const CLIENT_ID = "370645265767-phukpstpp7prf0ioh2tt6khc6dchk015.apps.googleusercontent.com";
// 擴充權限：加入 Google Sheets API 的讀寫權限
const SCOPES = "https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/spreadsheets"; 
// 你提供的 Spreadsheet ID
const SPREADSHEET_ID = "1Q7ncYV9-a_Vl54spHHH96x_FunVlf15QNLIbARJahq4";

let accessToken = null;
let tokenClient = null;

// Modal 控制邏輯
const modal = document.getElementById("taskModal");
document.getElementById("openModalBtn").addEventListener("click", () => modal.classList.remove("hidden"));
document.getElementById("closeModalBtn").addEventListener("click", () => modal.classList.add("hidden"));
document.getElementById("cancelBtn").addEventListener("click", () => modal.classList.add("hidden"));

window.addEventListener("load", () => {
  // 1. 網頁載入時，先去 localStorage 找找看有沒有之前存下來的 Token
  const savedToken = localStorage.getItem("google_access_token");
  if (savedToken) {
    accessToken = savedToken;
    setLoggedInUI(true);
    loadSettingsFromSheets();
    loadTasksFromSheets();
  }

  // 2. 初始化 Google 登入客戶端
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) return alert("登入失敗：" + resp.error);
      accessToken = resp.access_token;
      
      // 💡 關鍵新增：登入成功後，把 Token 存進瀏覽器！
      localStorage.setItem("google_access_token", accessToken);
      
      setLoggedInUI(true);
      loadSettingsFromSheets();
      loadTasksFromSheets();
    },
  });

  // 3. 綁定按鈕
  document.getElementById("loginBtn").addEventListener("click", () => tokenClient.requestAccessToken({ prompt: "consent" }));
  
  document.getElementById("logoutBtn").addEventListener("click", () => {
    // 💡 關鍵新增：登出時，把瀏覽器裡的 Token 刪掉
    localStorage.removeItem("google_access_token");
    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => { 
        accessToken = null; 
        setLoggedInUI(false); 
      });
    } else {
      setLoggedInUI(false);
    }
  });
});

function setLoggedInUI(loggedIn) {
  document.getElementById("loginBtn").classList.toggle("hidden", loggedIn);
  document.getElementById("logoutBtn").classList.toggle("hidden", !loggedIn);
  document.getElementById("openModalBtn").classList.toggle("hidden", !loggedIn);
  document.getElementById("userStatus").textContent = loggedIn ? "✅ 已連線至資料庫" : "";
}

// 核心功能：從 Google Sheets 抓取自訂選項
async function loadSettingsFromSheets() {
  try {
    // 1. 同時發送三個請求，抓取類別、聯絡人，以及新增的「任務來源」(假設在 G 欄)
    const [catRes, contactRes, sourceRes] = await Promise.all([
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!A2:A`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!C2:E`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!G2:G`, { headers: { Authorization: `Bearer ${accessToken}` } }) // 新增這行抓取 G 欄
    ]);

    const catData = await catRes.json();
    const contactData = await contactRes.json();
    const sourceData = await sourceRes.json(); // 解析任務來源資料

    // 2. 更新「專案類別」選單
    const catSelect = document.getElementById("categorySelect");
    catSelect.innerHTML = '<option value="">請選擇...</option>';
    // 同時建立上方篩選器的類別核取方塊
    const catFilterGroup = document.getElementById("categoryFilterGroup");
    let catFilterHtml = '<span class="text-sm font-bold text-slate-600 bg-slate-200 px-2 py-1 rounded">類別篩選</span>';
    
    if (catData.values) {
      catData.values.forEach(row => {
        if(row[0]) {
          // 塞入新增案件的下拉表單
          catSelect.innerHTML += `<option value="${row[0]}">${row[0]}</option>`;
          // 塞入表格上方的核取篩選器 (預設全勾)
          catFilterHtml += `<label class="cursor-pointer flex items-center gap-1 text-sm text-slate-700 font-medium"><input type="checkbox" value="${row[0]}" class="filter-category w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" checked onchange="applyFilter()"> ${row[0]}</label>`;
        }
      });
    }
    catFilterGroup.innerHTML = catFilterHtml;

    // 3. 更新「聯絡人」選單
    const contactSelect = document.getElementById("contactSelect");
    contactSelect.innerHTML = '<option value="">請選擇...</option>';
    if (contactData.values) {
      contactData.values.forEach(row => {
        if(row[0]) {
          const ext = row[1] ? ` (分機: ${row[1]})` : '';
          contactSelect.innerHTML += `<option value="${row[0]}">${row[0]}${ext}</option>`;
        }
      });
    }

    // 4. 更新「任務來源」選單 (新加入的邏輯)
    const sourceSelect = document.getElementById("taskSource");
    sourceSelect.innerHTML = '<option value="">請選擇...</option>';
    if (sourceData.values) {
      sourceData.values.forEach(row => {
        if(row[0]) sourceSelect.innerHTML += `<option value="${row[0]}">${row[0]}</option>`;
      });
    }

    console.log("✅ 系統設定載入成功！");
  } catch (error) {
    console.error("載入設定失敗:", error);
    alert("讀取試算表失敗，請確定你有建立『系統設定』分頁，並且欄位名稱正確。");
  }
}
// 綁定儲存按鈕的點擊事件
document.getElementById("saveTaskBtn").addEventListener("click", saveTaskToSheets);

async function saveTaskToSheets() {
  if (!accessToken) return alert("請先登入！");

  const category = document.getElementById("categorySelect").value;
  const contact = document.getElementById("contactSelect").value;
  const source = document.getElementById("taskSource").value; // 1. 抓取任務來源
  const title = document.getElementById("taskTitle").value;
  const details = document.getElementById("taskDetails").value;
  
  if (!title) return alert("任務摘要不能是空的喔！");

  const now = new Date().toLocaleString('zh-TW');
  
  // 2. 依照試算表的 A~I 欄位順序排好陣列
  const rowData = [
    "待處理",   // A
    category,   // B
    contact,    // C
    source,     // D (新加入的任務來源)
    title,      // E
    details,    // F
    "",         // G (死線)
    now,        // H (建立時間)
    now         // I (最後更新)
  ];

  try {
    // 3. 注意這裡的範圍從 A:H 改成了 A:I
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/案件總表!A:I:append?valueInputOption=USER_ENTERED`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ values: [rowData] })
    });

    const result = await response.json();
    
    if (result.updates) {
      alert("✅ 案件儲存成功！");
      document.getElementById("taskSource").value = ""; // 清空新增的欄位
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDetails").value = "";
      modal.classList.add("hidden");

      loadTasksFromSheets(); // 儲存成功後自動重新整理表格！
    } else {
      console.error("儲存失敗:", result);
    }
  } catch (error) {
    console.error("發生錯誤:", error);
  }
}
// 核心功能：從 Google Sheets 讀取案件總表並顯示在畫面上
async function loadTasksFromSheets() {
  try {
    // 💡 抓取範圍延伸到 K 欄 (標籤)
    const range = encodeURIComponent("案件總表!A2:K");
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`, {
      headers: { Authorization: `Bearer ${accessToken}` },
      cache: "no-store" 
    });
    
    if (response.status === 401) return alert("⚠️ 憑證過期，請重新登入！");
    const data = await response.json();
    const tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = ""; 

    if (!data.values || data.values.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-10 text-center text-slate-400">目前沒有任何案件！</td></tr>';
      return;
    }

    const rowsWithIndex = data.values.map((row, index) => ({ rowData: row, rowIndex: index + 2 }));
    const validRows = rowsWithIndex.filter(item => item.rowData.length > 0 && item.rowData[0] !== "");
    const rows = validRows.reverse(); 
    
    let urgentCount = 0, todoCount = 0, doingCount = 0, waitingCount = 0;
    
    // 💡 取得今天的日期 (格式：YYYY/MM/DD) 以判斷今日急件
    const today = new Date();
    const todayStr = `${today.getFullYear()}/${(today.getMonth()+1).toString().padStart(2,'0')}/${today.getDate().toString().padStart(2,'0')}`;
    
    rows.forEach(item => {
      const row = item.rowData;
      const rowIndex = item.rowIndex; 
      const status = row[0] || "未定";
      
      if (status === "已作廢") return;

      const category = row[1] || "";
      const contact = row[2] || "";
      const source = row[3] || "";
      const title = row[4] || "";
      const deadline = row[6] || "";
      const lastUpdate = row[8] || row[7] || ""; 
      const historyLog = row[9] || ""; 
      const tags = row[10] || ""; // 💡 抓取 K 欄的標籤
      
      // 💡 統計邏輯升級：只有「死線小於等於今天」且「未結案」才算今日急件！
      if (status.includes("待處理")) todoCount++;
      if (status.includes("進行中")) doingCount++;
      if (status.includes("卡關") || status.includes("等回覆")) waitingCount++;
      if (deadline !== "" && deadline <= todayStr && !status.includes("結案")) urgentCount++; 

      let statusColor = "bg-slate-100 text-slate-600";
      if (status.includes("待處理")) statusColor = "bg-amber-100 text-amber-700";
      else if (status.includes("進行中")) statusColor = "bg-blue-100 text-blue-700";
      else if (status.includes("結案")) statusColor = "bg-emerald-100 text-emerald-700";

      // 💡 渲染標籤：把逗號分隔的文字，變成一顆顆的 HTML 標籤
      let tagsHtml = "";
      if (tags) {
        tagsHtml = tags.split(',').map(t => `<span class="inline-block bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full text-xs font-medium mr-1 mb-1">${t.trim()}</span>`).join('');
      }

      const logEncoded = encodeURIComponent(historyLog);
      // 傳遞給 Modal 時，多傳一個標籤參數
      const tagsEncoded = encodeURIComponent(tags); 

      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-0" data-status="${status}" data-urgent="${(deadline !== "" && deadline <= todayStr && !status.includes("結案")) ? 'yes' : 'no'}">
          <td class="px-6 py-3"><span class="px-2 py-1 rounded-md text-xs font-bold ${statusColor}">${status}</span></td>
          <td class="px-6 py-3 font-medium text-slate-700">${category}</td>
          <td class="px-6 py-3 text-slate-600">${contact}</td>
          <td class="px-6 py-3 text-slate-400 text-xs">${source}</td>
          <td class="px-6 py-3 font-bold text-slate-800">${title}</td>
          <td class="px-6 py-3">${tagsHtml}</td> 
          <td class="px-6 py-3 text-rose-500 font-medium text-sm">${deadline || "-"}</td>
          <td class="px-6 py-3 text-xs text-slate-400">${lastUpdate}</td>
          <td class="px-6 py-3 text-center space-x-2">
            <button onclick="openTaskDetail(${rowIndex}, '${status}', '${logEncoded}', '${tagsEncoded}')" class="text-blue-500 hover:text-blue-700 text-sm font-bold transition">✏️ 處理</button>
            <button onclick="deleteTask(${rowIndex}, '${logEncoded}')" class="text-rose-500 hover:text-rose-700 text-sm font-bold transition">🗑️ 刪除</button>
          </td>
        </tr>
      `;
    });
    
    if (document.getElementById("countUrgent")) document.getElementById("countUrgent").textContent = urgentCount;
    if (document.getElementById("countTodo")) document.getElementById("countTodo").textContent = todoCount;
    if (document.getElementById("countDoing")) document.getElementById("countDoing").textContent = doingCount;
    if (document.getElementById("countWaiting")) document.getElementById("countWaiting").textContent = waitingCount;

    if (typeof applyFilter === "function") applyFilter();
  } catch (error) {
    console.error("載入失敗:", error);
  }
}

// 儲存目前正在編輯的列數與歷史紀錄
let currentEditingRow = null;
let currentEditingLog = "";

// 🟢 點擊「✏️ 處理」按鈕時：打開 Modal 並把資料塞進去
function openTaskDetail(rowIndex, status, logEncoded, tagsEncoded) {
  currentEditingRow = rowIndex;
  currentEditingLog = decodeURIComponent(logEncoded);
  
  // 設定狀態下拉選單的預設值
  document.getElementById("detailStatus").value = status;
  // 清空輸入說明框
  document.getElementById("detailNote").value = ""; 
  // 💡 把標籤解碼後塞進輸入框
  document.getElementById("detailTags").value = tagsEncoded ? decodeURIComponent(tagsEncoded) : ""; 
  // 顯示歷史 LOG (如果沒有紀錄，就顯示提示文字)
  const logContainer = document.getElementById("detailLog");
  logContainer.textContent = currentEditingLog || "目前尚無處理歷程。";
  
  // 顯示 Modal
  document.getElementById("taskDetailModal").classList.remove("hidden");
}

// 🔴 關閉 Modal
function closeTaskDetailModal() {
  document.getElementById("taskDetailModal").classList.add("hidden");
  currentEditingRow = null;
  currentEditingLog = "";
}

// 💾 點擊 Modal 內的「儲存變更」按鈕
document.getElementById("saveDetailBtn").addEventListener("click", async () => {
  if (!currentEditingRow) return;
  
  const newStatus = document.getElementById("detailStatus").value;
  const note = document.getElementById("detailNote").value.trim();
  const tags = document.getElementById("detailTags").value.trim();
  
  // 讓按鈕顯示「儲存中」防止重複點擊
  const btn = document.getElementById("saveDetailBtn");
  const originalText = btn.textContent;
  btn.textContent = "儲存中...";
  btn.disabled = true;

  // 呼叫更新 API
  await updateTaskDetailAPI(currentEditingRow, newStatus, note, currentEditingLog, tags);
  
  // 恢復按鈕狀態並關閉 Modal
  btn.textContent = originalText;
  btn.disabled = false;
  closeTaskDetailModal();
});

// ⚙️ 核心 API：將狀態、說明、新 LOG 寫回 Google Sheets
async function updateTaskDetailAPI(rowIndex, newStatus, note, currentLog, tags) {
  try {
    // 1. 產生當下時間
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 2. 組合新的 LOG 條目
    let newLogEntry = `[${timeString}] 狀態變更：${newStatus}`;
    if (note) {
      newLogEntry += `\n └ 說明：${note}`; // 如果有寫說明，加上縮排顯示在下一行
    }
    
    // 3. 把新 LOG 疊加到舊 LOG 下方
    const updatedLog = currentLog ? `${currentLog}\n\n${newLogEntry}` : newLogEntry;

    // 4. 打包資料
    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!I${rowIndex}:K${rowIndex}`, values: [[timeString, updatedLog, tags]] }
      ]
    };

    // 5. 發送更新請求
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件紀錄更新成功！");
      loadTasksFromSheets(); // 立刻刷新首頁表格
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路異常，請查看 Console。");
  }
}

// ⚠️ 保留原本的刪除功能 (只需微調傳遞給 API 的方式)
async function deleteTask(rowIndex, logEncoded) {
  const confirmDelete = confirm("⚠️ 確定要刪除這筆案件嗎？\n(案件將會被標記為「已作廢」並從列表中隱藏)");
  if (!confirmDelete) return;
  
  // 刪除時不加說明，直接呼叫更新 API，狀態改為已作廢
  await updateTaskDetailAPI(rowIndex, "已作廢", "使用者刪除了此案件", decodeURIComponent(logEncoded));
}


// ⚙️ 核心 API 呼叫：負責把更新的狀態、時間、日誌寫回 Google Sheets
async function updateSheetData(rowIndex, newStatus, currentLog) {
  try {
    // 1. 產生當下的時間戳記
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 2. 組合處理歷程紀錄
    const newLogEntry = `[${timeString}] 變更為：${newStatus}`;
    const updatedLog = currentLog ? `${currentLog}\n${newLogEntry}` : newLogEntry;

    // 3. 打包要更新的資料 (使用 batchUpdate 可以一次更新多個不連續的欄位)
    // 我們要更新：A欄(狀態)、I欄(最後更新時間)、J欄(處理歷程)
    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!I${rowIndex}:J${rowIndex}`, values: [[timeString, updatedLog]] }
      ]
    };

    // 4. 發送請求給 Google Sheets
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件狀態更新成功！");
      loadTasksFromSheets(); // 重新載入畫面，讓畫面立刻反映最新結果
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路錯誤或系統異常，請查看 Console。");
  }
}

// 🔍 核心功能：根據多重核取方塊過濾表格內容
function applyFilter() {
  // 1. 取得目前所有「被打勾」的狀態與類別的值
  const checkedStatuses = Array.from(document.querySelectorAll('.filter-status:checked')).map(cb => cb.value);
  const checkedCategories = Array.from(document.querySelectorAll('.filter-category:checked')).map(cb => cb.value);
  
  // 2. 抓出表格裡面所有的資料行
  const rows = document.querySelectorAll("#taskTableBody tr");

  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;

    // 抓取這一行的狀態 (第1欄) 與 類別 (第2欄)
    const statusText = row.querySelector("td:nth-child(1) span").textContent;
    const categoryText = row.querySelector("td:nth-child(2)").textContent;

    // 邏輯判斷：只要該行的狀態和類別，包含在我們打勾的陣列裡面，就代表符合！
    const matchStatus = checkedStatuses.some(status => statusText.includes(status));
    const matchCategory = checkedCategories.includes(categoryText);

    // 必須「狀態」和「類別」都有打勾對應到的，才顯示出來
    if (matchStatus && matchCategory) {
      row.style.display = ""; 
    } else {
      row.style.display = "none"; 
    }
  });
}
  
// 點擊儀表板時觸發的過濾器
function filterByDashboard(type) {
  const rows = document.querySelectorAll("#taskTableBody tr");
  
  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;
    
    const status = row.getAttribute("data-status");
    const isUrgent = row.getAttribute("data-urgent");
    
    if (type === '急件' && isUrgent === 'yes') row.style.display = "";
    else if (type === '待處理' && status.includes('待處理')) row.style.display = "";
    else if (type === '進行中' && status.includes('進行中')) row.style.display = "";
    else if (type === '卡關' && (status.includes('卡關') || status.includes('等回覆'))) row.style.display = "";
    else row.style.display = "none";
  });
}
