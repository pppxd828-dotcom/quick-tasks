<!DOCTYPE html>
<html lang="zh-Hant"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專屬雜事追蹤管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; background-color: #f1f5f9; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="text-slate-800 min-h-screen">

<!-- 頂部導覽列 -->
<header class="bg-[#1e293b] text-white shadow-md sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-blue-500 p-1.5 rounded-lg">🛡️</div>
      <h1 class="text-lg font-bold tracking-wider">專屬雜事追蹤管理系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="userStatus" class="text-xs text-slate-300"></span>
      <button id="loginBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 transition">☁️ 雲端同步登入</button>
      <button id="logoutBtn" class="hidden px-4 py-2 rounded-md bg-slate-700 text-slate-200 text-sm font-bold hover:bg-slate-600 transition">登出</button>
      <button id="openModalBtn" class="hidden px-4 py-2 rounded-md bg-emerald-500 text-white text-sm font-bold hover:bg-emerald-600 transition shadow-sm">+ 新增案件</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 mt-6">

  <!-- 💡 期限甘特圖(時間軸)：有填最後期限的案件會以圓點呈現在對應日期上；預設收合，需要時再展開 -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
      <button type="button" onclick="toggleGanttChart()" class="flex items-center gap-2 text-sm font-bold text-slate-600 hover:text-slate-800 transition">
        <span id="ganttToggleIcon" class="text-xs text-slate-400 inline-block transition-transform">▶</span>
        <span>📅 期限時間軸</span>
      </button>
      <div class="flex items-center gap-4 text-xs text-slate-400">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span>已逾期</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>今天到期</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span>尚未到期</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>已結案</span>
      </div>
    </div>
    <div id="ganttCollapseWrapper" class="hidden">
      <div id="ganttWrapper" class="overflow-x-auto pb-2">
        <div id="ganttChart" class="relative" style="height:150px;">
          <div class="flex items-center justify-center h-full text-xs text-slate-300">載入中...</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 四大狀態卡片 (儀表板) -->
  <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div onclick="filterByDashboard('急件')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-500 text-2xl">🚨</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">今日急件</p>
        <p id="countUrgent" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('待處理')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 text-2xl">📥</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">待處理清單</p>
        <p id="countTodo" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('進行中')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-2xl">🏃</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">處理/盤點中</p>
        <p id="countDoing" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('卡關')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center text-purple-500 text-2xl">🤝</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">卡關/等回覆</p>
        <p id="countWaiting" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
  </section>

  <!-- 案件資料表區域 -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200">
    
    <!-- 頂部過濾器與按鈕區塊 -->
    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      
      <!-- 💡 左側：篩選器群組 (透過 flex 和 gap-3 讓它們橫向、整齊排列) -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- 1. 狀態篩選 -->
        <div class="relative" id="statusDropdown">
          <button onclick="toggleDropdown('statusMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="statusBtnText">狀態 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="statusMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇狀態</span>
              <button onclick="selectAllOptions('status', '狀態')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div class="max-h-48 overflow-y-auto p-1">
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="待處理" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full text-xs font-bold">待處理</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="進行中" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full text-xs font-bold">進行中</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="卡關" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full text-xs font-bold">卡關</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="等回覆" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full text-xs font-bold">等回覆</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="結案" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full text-xs font-bold">結案</span></label>
            </div>
          </div>
        </div>

        <!-- 2. 類別篩選 -->
        <div class="relative" id="categoryDropdown">
          <button onclick="toggleDropdown('categoryMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="categoryBtnText">類別 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="categoryMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇類別</span>
              <button onclick="selectAllOptions('category', '類別')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div id="categoryFilterList" class="max-h-48 overflow-y-auto p-1">
              <div class="text-center text-xs text-slate-400 py-2">載入中...</div>
            </div>
          </div>
        </div>

        <!-- 3. 廠商篩選 -->
        <div class="relative" id="vendorDropdown">
          <button onclick="toggleDropdown('vendorMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="vendorBtnText">廠商 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="vendorMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇廠商</span>
              <button onclick="selectAllOptions('vendor', '廠商')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div class="max-h-48 overflow-y-auto p-1">
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="DMS" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">DMS</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="三商" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">三商</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="迪堡多富" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">迪堡多富</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="國眾" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">國眾</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="無" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">無 / 內部</span></label>
            </div>
          </div>
        </div>

        <!-- 4. 處理人篩選 -->
        <div class="relative" id="assigneeDropdown">
          <button onclick="toggleDropdown('assigneeMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="assigneeBtnText">處理人 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="assigneeMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇處理人</span>
              <button onclick="selectAllOptions('assignee', '處理人')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div id="assigneeFilterList" class="max-h-48 overflow-y-auto p-1">
              <div class="text-center text-xs text-slate-400 py-2">載入中...</div>
            </div>
          </div>
        </div>
        
      </div> <!-- /結束左側篩選器群組 -->

      <!-- 右側：欄位設定 + 匯出按鈕 -->
      <div class="flex items-center gap-2">
        <div class="relative" id="columnToggleDropdown">
          <button type="button" onclick="toggleColumnMenu()" class="px-3 py-1.5 text-sm font-bold text-slate-500 bg-slate-100 rounded-md hover:bg-slate-200">🧩 更多欄位</button>
          <div id="columnMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-30 p-2">
            <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer">
              <input type="checkbox" onchange="toggleColumn('contact', this)" class="w-4 h-4 rounded text-blue-600">
              <span class="text-sm text-slate-700">聯絡人</span>
            </label>
            <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer">
              <input type="checkbox" onchange="toggleColumn('source', this)" class="w-4 h-4 rounded text-blue-600">
              <span class="text-sm text-slate-700">任務來源</span>
            </label>
          </div>
        </div>
        <button class="px-3 py-1.5 text-sm font-bold text-emerald-600 bg-emerald-50 rounded-md hover:bg-emerald-100">📥 匯出 Excel</button>
      </div>
      
    </div>

    <!-- 💡 標籤篩選中的提示條，點選任一標籤即可觸發 -->
    <div id="tagFilterBanner" class="hidden items-center gap-2 px-3 py-2 mb-3 bg-purple-50 border border-purple-200 rounded-lg text-sm text-purple-700">
      🏷️ 篩選標籤：<span id="tagFilterLabel" class="font-bold"></span>
      <button onclick="clearTagFilter()" class="ml-auto text-purple-500 hover:text-purple-700 font-bold">清除 ✕</button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200">
            <th class="px-3 py-4 font-semibold text-center whitespace-nowrap" data-col="delete">刪除</th>
            <th class="px-3 py-4 font-semibold text-center whitespace-nowrap" data-col="edit">編輯</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap cursor-pointer select-none hover:text-slate-600" data-col="category" onclick="sortTable('category')">專案類別<span class="sort-arrow" data-sort-key="category"></span></th>
            <th class="px-6 py-4 font-bold text-indigo-600 whitespace-nowrap cursor-pointer select-none hover:text-indigo-800" data-col="vendor" onclick="sortTable('vendor')">負責廠商<span class="sort-arrow" data-sort-key="vendor"></span></th>
            <!-- 💡 任務摘要保留彈性，並設定最小寬度避免被擠太扁 -->
            <th class="px-6 py-4 font-semibold text-left min-w-[200px] cursor-pointer select-none hover:text-slate-600" data-col="title" onclick="sortTable('title')">任務摘要<span class="sort-arrow" data-sort-key="title"></span></th>
            <th class="px-6 py-4 font-bold whitespace-nowrap cursor-pointer select-none hover:text-slate-600" data-col="status" onclick="sortTable('status')">狀態<span class="sort-arrow" data-sort-key="status"></span></th>
            <th class="px-6 py-4 font-bold text-blue-600 whitespace-nowrap cursor-pointer select-none hover:text-blue-800" data-col="assignee" onclick="sortTable('assignee')">處理人<span class="sort-arrow" data-sort-key="assignee"></span></th>
            <th class="px-6 py-4 font-semibold text-left whitespace-nowrap cursor-pointer select-none hover:text-slate-600" data-col="tags" onclick="sortTable('tags')">標籤<span class="sort-arrow" data-sort-key="tags"></span></th>
            <th class="px-6 py-4 font-bold whitespace-nowrap cursor-pointer select-none hover:text-slate-600" data-col="deadline" onclick="sortTable('deadline')">最後期限<span class="sort-arrow" data-sort-key="deadline"></span></th>
            <th class="px-6 py-4 font-bold whitespace-nowrap cursor-pointer select-none hover:text-slate-600" data-col="lastupdate" onclick="sortTable('lastupdate')">最後更新<span class="sort-arrow" data-sort-key="lastupdate"></span></th>
            <th class="px-6 py-4 font-bold whitespace-nowrap hidden" data-col="contact">聯絡人</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap hidden" data-col="source">任務來源</th>
          </tr>
        </thead>
        <tbody id="taskTableBody" class="text-sm divide-y divide-slate-100">
          <tr>
            <td colspan="12" class="px-6 py-10 text-center text-slate-400">請先登入以載入資料...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- 新增案件 Modal 表單 -->
<div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center">
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h2 class="text-lg font-bold text-slate-800">新增追蹤案件</h2>
      <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
    </div>
    <div class="p-6 grid grid-cols-2 gap-4">
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">專案類別 (來自 Google Sheets)</label>
        <select id="categorySelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">負責廠商</label>
        <select id="vendorSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="無">無 / 內部處理</option>
          <option value="DMS">DMS</option>
          <option value="三商">三商</option>
          <option value="迪堡多富">迪堡多富</option>
          <option value="國眾">國眾</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">聯絡人 (來自 Google Sheets)</label>
        <div class="relative combo-field">
          <input type="hidden" id="contactSelect" value="">
          <button type="button" onclick="toggleCombo('contactSelect', this)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-left flex justify-between items-center bg-white hover:bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition">
            <span id="contactSelect_label" class="text-slate-400 truncate">請選擇...</span>
            <span class="text-slate-400 text-xs shrink-0 ml-2">▼</span>
          </button>
          <div id="contactSelect_panel" class="combo-panel hidden fixed z-50 bg-white border border-slate-200 rounded-lg shadow-xl overflow-hidden">
            <div class="p-2 border-b border-slate-100">
              <input type="text" placeholder="搜尋聯絡人..." class="combo-search w-full text-sm border border-slate-200 rounded px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500" oninput="renderComboList('contactSelect', this.value)" onkeydown="handleComboKeydown(event, 'contactSelect')">
            </div>
            <div id="contactSelect_list" class="max-h-56 overflow-y-auto p-1"></div>
          </div>
        </div>
      </div>
     <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">處理人 (來自 Google Sheets)</label>
        <select id="newTaskAssignee" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務來源 (來自 Google Sheets)</label>
        <select id="taskSource" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
       </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">最後期限</label>
        <input type="date" id="newTaskDeadline" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700">
      </div>
      <div class="col-span-2 sm:col-span-1">

      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!A2:A`, { headers: { Authorization: `Bearer ${accessToken}` } }),

async function saveTaskToSheets() {
  if (!accessToken) return alert("請先登入！");

  const category = document.getElementById("categorySelect").value;
  const vendor = document.getElementById("vendorSelect").value;      // 💡 抓取廠商
  const assignee = document.getElementById("newTaskAssignee").value; // 💡 抓處理人
  const contact = document.getElementById("contactSelect").value;
  const source = document.getElementById("taskSource").value;        // 💡 抓任務來源
  const title = document.getElementById("taskTitle").value;
  const newTags = document.getElementById("newTaskTags").value.trim();
  let newDeadline = document.getElementById("newTaskDeadline").value;
  if (newDeadline) newDeadline = newDeadline.replace(/-/g, '/'); // 轉換成 YYYY/MM/DD 格式
  const details = document.getElementById("taskDetails").value;
  
  if (!title) return alert("任務摘要不能是空的喔！");

  const now = new Date().toLocaleString('zh-TW');
  // 💡 建立初始的處理歷程紀錄，讓「處理軌跡」一開始就有「案件建立」這一筆
  const createdAt = new Date();
  const createdTimeStr = `${createdAt.getFullYear()}/${(createdAt.getMonth()+1).toString().padStart(2,'0')}/${createdAt.getDate().toString().padStart(2,'0')} ${createdAt.getHours().toString().padStart(2,'0')}:${createdAt.getMinutes().toString().padStart(2,'0')}`;
  const initialLog = `[${createdTimeStr}] 案件建立（狀態：待處理）`;
  
  // 2. 依照試算表的 A~I 欄位順序排好陣列
  const rowData = [
    "待處理", category, contact, source, title, details, newDeadline, now, now, initialLog, newTags, vendor,
    assignee // 💡 塞入第13格 (M欄)
  ];

  try {
    // 3. 網址最後的範圍從 A:I 改成 A:M
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/案件總表!A:M:append?valueInputOption=USER_ENTERED`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ values: [rowData] })
    });

    const result = await response.json();
    
if (result.updates) {
  alert("✅ 案件儲存成功！");
      
    // 💡 徹底清空所有新增案件 Modal 的欄位，恢復預設值
    document.getElementById("categorySelect").value = "";
    document.getElementById("vendorSelect").value = "無"; // 廠商預設為「無」
    setComboValue("contactSelect", "");
    document.getElementById("taskSource").value = ""; 
    document.getElementById("newTaskAssignee").value = ""; // 處理人
    document.getElementById("newTaskDeadline").value = "";
    document.getElementById("newTaskTags").value = "";
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskDetails").value = "";
      
    // 關閉 Modal 並重新載入表格
    modal.classList.add("hidden");
    loadTasksFromSheets(); 
  } else {
    console.error("儲存失敗:", result);
  }
  } catch (error) {
    console.error("發生錯誤:", error);
  }
}
// 核心功能：從 Google Sheets 讀取案件總表並顯示在畫面上
async function loadTasksFromSheets() {
  try {
    // 💡 抓取範圍延伸到 M 欄 (標籤)
    const range = encodeURIComponent("案件總表!A2:M");
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`, {
      headers: { Authorization: `Bearer ${accessToken}` },
      cache: "no-store" 
    });
    
    if (response.status === 401) return alert("⚠️ 憑證過期，請重新登入！");
    const data = await response.json();
    const tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = ""; 

    if (!data.values || data.values.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-10 text-center text-slate-400">目前沒有任何案件！</td></tr>';
      renderGanttChart([]);
      return;
    }

    const rowsWithIndex = data.values.map((row, index) => ({ rowData: row, rowIndex: index + 2 }));
    const validRows = rowsWithIndex.filter(item => item.rowData.length > 0 && item.rowData[0] !== "");
    const rows = validRows.reverse(); 
    
    let urgentCount = 0, todoCount = 0, doingCount = 0, waitingCount = 0;
    const ganttItems = []; // 💡 收集有填「最後期限」的案件，畫在上方時間軸
    
    // 💡 取得今天的日期 (格式：YYYY/MM/DD) 以判斷今日急件
    const today = new Date();
    const todayStr = `${today.getFullYear()}/${(today.getMonth()+1).toString().padStart(2,'0')}/${today.getDate().toString().padStart(2,'0')}`;
    
    rows.forEach(item => {
      const row = item.rowData;
      const rowIndex = item.rowIndex; 
      const status = row[0] || "未定";
      
      if (status === "已作廢") return;

      const category = row[1] || "";
      const contact = row[2] || "";
      const source = row[3] || "";
      const title = row[4] || "";
      const deadline = row[6] || "";
      const lastUpdate = row[8] || row[7] || ""; 
      const historyLog = row[9] || ""; 
      const tags = row[10] || ""; // 💡 抓取 K 欄的標籤
      const vendor = row[11] || "無"; // 💡 抓取 L 欄，舊案件如果沒有填就顯示「無」
      const assignee = row[12] || ""; // 💡 抓 M 欄處理人
     
      // 💡 統計邏輯升級：只有「死線小於等於今天」且「未結案」才算今日急件！
      if (status.includes("待處理")) todoCount++;
      if (status.includes("進行中")) doingCount++;
      if (status.includes("卡關") || status.includes("等回覆")) waitingCount++;
      if (deadline !== "" && deadline <= todayStr && !status.includes("結案")) urgentCount++; 
      if (deadline !== "") ganttItems.push({ title, deadline, status });

      let statusColor = "bg-slate-100 text-slate-600";
      if (status.includes("待處理")) statusColor = "bg-amber-100 text-amber-700";
      else if (status.includes("進行中")) statusColor = "bg-blue-100 text-blue-700";
      else if (status.includes("結案")) statusColor = "bg-emerald-100 text-emerald-700";

      // 💡 渲染標籤：把逗號分隔的文字，變成一顆顆可點擊篩選的 HTML 標籤
      let tagsHtml = "";
      if (tags) {
        tagsHtml = tags.split(',').map(t => {
          const trimmed = t.trim();
          if (!trimmed) return '';
          const encTag = encodeURIComponent(trimmed);
          return `<span onclick="filterByTag('${encTag}')" class="inline-block bg-purple-100 text-purple-700 hover:bg-purple-200 cursor-pointer px-2 py-0.5 rounded-full text-xs font-medium mr-1 mb-1 transition" title="點擊以篩選相同標籤">${escapeHtml(trimmed)}</span>`;
        }).join('');
      }

      const logEncoded = encodeURIComponent(historyLog);
      // 傳遞給 Modal 時，多傳一個標籤參數
      const tagsEncoded = encodeURIComponent(tags); 
      // 💡 在渲染按鈕前，先把所有要帶入 Modal 的資料打包編碼
      const encLog = encodeURIComponent(historyLog);
      const encTags = encodeURIComponent(tags);
      const encCat = encodeURIComponent(category);
      const encVendor = encodeURIComponent(vendor);
      const encContact = encodeURIComponent(contact);
      const encSource = encodeURIComponent(source);
      const encDeadline = encodeURIComponent(deadline);
      const encAssignee = encodeURIComponent(assignee);
      
      // 💡 欄位順序：刪除、編輯、專案類別、負責廠商、任務摘要、狀態、處理人、標籤、最後期限、最後更新，其餘(聯絡人/任務來源)預設隱藏
      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-0"
            data-status="${status}" data-urgent="${(deadline !== "" && deadline <= todayStr && !status.includes("結案")) ? 'yes' : 'no'}"
            data-sort-category="${escapeHtml(category)}" data-sort-vendor="${escapeHtml(vendor)}" data-sort-title="${escapeHtml(title)}"
            data-sort-status="${escapeHtml(status)}" data-sort-assignee="${escapeHtml(assignee)}" data-sort-tags="${escapeHtml(tags)}"
            data-sort-deadline="${escapeHtml(deadline)}" data-sort-lastupdate="${escapeHtml(lastUpdate)}">
          <td class="px-3 py-3 text-center whitespace-nowrap" data-col="delete">
            <button onclick="deleteTask(${rowIndex}, '${logEncoded}')" class="text-rose-500 hover:text-rose-700 transition text-base" title="刪除">🗑️</button>
          </td>
          <td class="px-3 py-3 text-center whitespace-nowrap" data-col="edit">
            <button onclick="openTaskDetail(${rowIndex}, '${status}', '${encLog}', '${encTags}', '${encCat}', '${encVendor}', '${encContact}', '${encSource}', '${encDeadline}', '${encAssignee}')" class="text-blue-500 hover:text-blue-700 transition text-base" title="編輯">✏️</button>
          </td>
          <td class="px-6 py-3 font-medium text-slate-700 whitespace-nowrap" data-col="category">${category}</td>
          <td class="px-6 py-3 font-bold text-indigo-600 whitespace-nowrap" data-col="vendor">${vendor}</td>
          <!-- 💡 任務摘要不加 nowrap，讓過長的敘述可以自然換行，版面才不會無限長 -->
          <td class="px-6 py-3 font-bold text-slate-800" data-col="title">${title}</td>
          <td class="px-6 py-3 whitespace-nowrap" data-col="status"><span class="px-2 py-1 rounded-md text-xs font-bold ${statusColor}">${status}</span></td>
          <td class="px-6 py-3 font-bold text-blue-600 whitespace-nowrap" data-col="assignee">${assignee}</td>
          <!-- 💡 標籤加個最大寬度，避免標籤太多把版面撐爆 -->
          <td class="px-6 py-3 max-w-[150px]" data-col="tags">${tagsHtml}</td> 
          <td class="px-6 py-3 text-rose-500 font-medium text-sm whitespace-nowrap" data-col="deadline">${deadline || "-"}</td>
          <td class="px-6 py-3 text-xs text-slate-400 whitespace-nowrap" data-col="lastupdate">${lastUpdate}</td>
          <td class="px-6 py-3 text-slate-600 whitespace-nowrap hidden" data-col="contact">${contact}</td>
          <td class="px-6 py-3 text-slate-400 text-xs whitespace-nowrap hidden" data-col="source">${source}</td>
        </tr>
      `;
    });
    
    if (document.getElementById("countUrgent")) document.getElementById("countUrgent").textContent = urgentCount;
    if (document.getElementById("countTodo")) document.getElementById("countTodo").textContent = todoCount;
    if (document.getElementById("countDoing")) document.getElementById("countDoing").textContent = doingCount;
    if (document.getElementById("countWaiting")) document.getElementById("countWaiting").textContent = waitingCount;

    renderGanttChart(ganttItems);

    reapplySort();
    if (typeof applyFilter === "function") applyFilter();
  } catch (error) {
    console.error("載入失敗:", error);
  }
}

// 💡 畫出最上方的「期限時間軸」：把有填最後期限的案件，以圓點畫在對應日期上
function renderGanttChart(items) {
  const chart = document.getElementById("ganttChart");
  if (!chart) return;

  if (!items || items.length === 0) {
    chart.style.height = "60px";
    chart.style.width = "100%";
    chart.innerHTML = '<div class="flex items-center justify-center h-full text-xs text-slate-300">目前沒有設定「最後期限」的案件</div>';
    return;
  }

  // 將 "YYYY/MM/DD" 轉成 Date 物件（避免用 new Date(string) 造成時區誤差）
  const parseDate = (s) => {
    const [y, m, d] = s.split('/').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  };
  const pad2 = (n) => n.toString().padStart(2, '0');
  const toKey = (d) => `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayStr = toKey(today);

  const dates = items.map(i => parseDate(i.deadline)).filter(d => !isNaN(d));
  if (dates.length === 0) {
    chart.innerHTML = '<div class="flex items-center justify-center h-full text-xs text-slate-300">期限日期格式異常</div>';
    return;
  }

  let minDate = new Date(Math.min(today, ...dates));
  let maxDate = new Date(Math.max(today, ...dates));

  // 前後各留 2 天緩衝，且至少涵蓋 14 天，畫面比較好看、不會擠成一團
  minDate.setDate(minDate.getDate() - 2);
  maxDate.setDate(maxDate.getDate() + 2);
  const minSpanDays = 14;
  const currentSpan = Math.round((maxDate - minDate) / 86400000);
  if (currentSpan < minSpanDays) {
    maxDate.setDate(maxDate.getDate() + (minSpanDays - currentSpan));
  }

  const totalDays = Math.round((maxDate - minDate) / 86400000);
  const dayWidth = 44; // 每一天的寬度(px)
  const chartWidth = totalDays * dayWidth;
  const AXIS_BOTTOM = 22; // 軸線距離底部的高度，留給日期刻度文字

  // 依「日期」分組，計算同一天內堆疊了幾個點(避免重疊)
  const laneMap = {};
  const sortedItems = [...items].sort((a, b) => parseDate(a.deadline) - parseDate(b.deadline));

  let dotsHtml = "";
  let maxLane = 0;

  sortedItems.forEach(item => {
    const d = parseDate(item.deadline);
    if (isNaN(d)) return;
    const dayOffset = Math.round((d - minDate) / 86400000);
    const x = dayOffset * dayWidth + dayWidth / 2;

    const lane = laneMap[item.deadline] || 0;
    laneMap[item.deadline] = lane + 1;
    maxLane = Math.max(maxLane, lane);
    const bottom = AXIS_BOTTOM + 14 + lane * 24;

    let colorClass = "bg-blue-500";
    let ringClass = "";
    if (item.status.includes("結案")) {
      colorClass = "bg-emerald-500";
    } else if (item.deadline < todayStr) {
      colorClass = "bg-rose-500";
      ringClass = "ring-4 ring-rose-100";
    } else if (item.deadline === todayStr) {
      colorClass = "bg-amber-500";
      ringClass = "ring-4 ring-amber-100";
    }

    const safeTitle = String(item.title || "(無摘要)")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    dotsHtml += `
      <div class="absolute group" style="left:${x}px; bottom:${bottom}px; transform: translateX(-50%);">
        <div class="w-3.5 h-3.5 rounded-full ${colorClass} ${ringClass} border-2 border-white shadow cursor-default hover:scale-125 transition"></div>
        <div class="hidden group-hover:block absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs rounded-lg px-3 py-2 whitespace-nowrap z-30 shadow-lg pointer-events-none">
          <div class="font-bold">${safeTitle}</div>
          <div class="text-slate-300 mt-0.5">${item.deadline}</div>
        </div>
      </div>
    `;
  });

  // 畫軸線與日期刻度：天數多的話拉大標籤間距，避免擠在一起
  const labelStep = totalDays > 60 ? 7 : (totalDays > 24 ? 3 : 1);
  let axisHtml = `<div class="absolute" style="left:0; right:0; bottom:${AXIS_BOTTOM}px; width:${chartWidth}px; border-top:1px solid #e2e8f0;"></div>`;

  for (let i = 0; i <= totalDays; i += labelStep) {
    const d = new Date(minDate);
    d.setDate(d.getDate() + i);
    const x = i * dayWidth;
    const isToday = toKey(d) === todayStr;
    const label = isToday ? "今天" : `${d.getMonth() + 1}/${d.getDate()}`;
    axisHtml += `
      <div class="absolute" style="left:${x}px; bottom:${AXIS_BOTTOM - 6}px; transform: translateX(-50%);">
        <div class="w-px h-1.5 bg-slate-300 mx-auto"></div>
        <div class="text-[10px] mt-0.5 whitespace-nowrap ${isToday ? 'text-amber-600 font-bold' : 'text-slate-400'}">${label}</div>
      </div>
    `;
  }

  // 「今天」的垂直參考虛線
  const todayOffset = Math.round((today - minDate) / 86400000);
  if (todayOffset >= 0 && todayOffset <= totalDays) {
    const todayX = todayOffset * dayWidth + dayWidth / 2;
    axisHtml += `<div class="absolute border-l-2 border-dashed border-amber-300" style="left:${todayX}px; bottom:${AXIS_BOTTOM}px; height:calc(100% - ${AXIS_BOTTOM}px);"></div>`;
  }

  const chartHeight = Math.max(150, AXIS_BOTTOM + 40 + (maxLane + 1) * 24);
  chart.style.height = chartHeight + "px";
  chart.style.width = chartWidth + "px";
  chart.style.minWidth = "100%";
  chart.innerHTML = axisHtml + dotsHtml;
}

// 💡 期限時間軸的收合/展開（預設收合，需要時再展開，並記住使用者的選擇）
function toggleGanttChart() {
  const wrapper = document.getElementById("ganttCollapseWrapper");
  const icon = document.getElementById("ganttToggleIcon");
  if (!wrapper) return;
  const willExpand = wrapper.classList.contains("hidden");
  wrapper.classList.toggle("hidden");
  if (icon) icon.style.transform = willExpand ? "rotate(90deg)" : "rotate(0deg)";
  try { localStorage.setItem("ganttCollapsed", willExpand ? "0" : "1"); } catch (e) {}
}

(function initGanttCollapseState() {
  let collapsed = "1"; // 預設收合
  try { collapsed = localStorage.getItem("ganttCollapsed") || "1"; } catch (e) {}
  if (collapsed === "0") {
    const wrapper = document.getElementById("ganttCollapseWrapper");
    const icon = document.getElementById("ganttToggleIcon");
    if (wrapper) wrapper.classList.remove("hidden");
    if (icon) icon.style.transform = "rotate(90deg)";
  }
})();

// 💡 通用的 HTML 逸出，避免使用者輸入的文字破壞版面或造成 XSS
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// ========================================================================
// 💡 通用「自訂下拉選單」元件：取代原生 <select>，避免選單被瀏覽器貼在
//    視窗最底部(甚至跟 Windows 工作列擠在一起)，改用頁面內的樣式卡片呈現
// ========================================================================
const comboStore = {};
const comboFiltered = {}; // fieldId -> 目前「顯示中」項目對應回 comboStore 的原始 index 陣列
const comboHighlight = {}; // fieldId -> 目前用鍵盤反白到第幾個(顯示中清單的 position)

// 設定某個欄位的選項清單。options: [{ value, primary, secondary, tag }]
function setComboOptions(fieldId, options) {
  comboStore[fieldId] = options || [];
  renderComboList(fieldId, "");
  // 若目前已有值，重新對齊顯示文字(例如選項資料是之後才載入的情況)
  const current = document.getElementById(fieldId);
  if (current && current.value) setComboValue(fieldId, current.value);
}

function renderComboList(fieldId, query) {
  const list = document.getElementById(fieldId + "_list");
  if (!list) return;
  const q = (query || "").trim().toLowerCase();
  const all = comboStore[fieldId] || [];
  const rows = all
    .map((o, idx) => ({ o, idx }))
    .filter(({ o }) => !q || `${o.primary} ${o.secondary || ""} ${o.tag || ""}`.toLowerCase().includes(q));

  comboFiltered[fieldId] = rows.map(r => r.idx);
  comboHighlight[fieldId] = rows.length ? 0 : -1; // 預設反白第一筆，可以直接按 Enter 選取

  if (rows.length === 0) {
    list.innerHTML = '<div class="px-3 py-4 text-center text-xs text-slate-400">查無符合的資料</div>';
    return;
  }

  list.innerHTML = rows.map(({ o, idx }, pos) => `
    <div class="combo-item flex items-center justify-between gap-2 px-3 py-2 rounded-lg cursor-pointer transition ${pos === 0 ? 'bg-blue-50' : ''}" data-pos="${pos}" onclick="selectCombo('${fieldId}', ${idx})" onmouseenter="setComboHighlight('${fieldId}', ${pos})">
      <div class="min-w-0">
        <div class="font-bold text-slate-700 text-sm truncate">${escapeHtml(o.primary)}</div>
        ${o.secondary ? `<div class="text-xs text-slate-400 truncate">${escapeHtml(o.secondary)}</div>` : ''}
      </div>
      ${o.tag ? `<span class="shrink-0 text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${escapeHtml(o.tag)}</span>` : ''}
    </div>
  `).join('');
}

// 反白顯示中清單的第 pos 筆(滑鼠移入或鍵盤上下鍵都會呼叫這裡)
function setComboHighlight(fieldId, pos) {
  const list = document.getElementById(fieldId + "_list");
  if (!list) return;
  comboHighlight[fieldId] = pos;
  list.querySelectorAll(".combo-item").forEach(el => {
    el.classList.toggle("bg-blue-50", Number(el.dataset.pos) === pos);
  });
}

// 鍵盤 ↑ / ↓：在目前顯示中的清單裡循環移動反白位置，並自動捲動到可視範圍內
function moveComboHighlight(fieldId, delta) {
  const list = document.getElementById(fieldId + "_list");
  if (!list) return;
  const items = list.querySelectorAll(".combo-item");
  if (items.length === 0) return;
  let pos = comboHighlight[fieldId];
  pos = (pos === undefined || pos === -1) ? -1 : pos;
  pos += delta;
  if (pos < 0) pos = items.length - 1;
  if (pos >= items.length) pos = 0;
  setComboHighlight(fieldId, pos);
  items[pos].scrollIntoView({ block: "nearest" });
}

// 按 Enter：選取目前反白的那一筆
function selectComboHighlighted(fieldId) {
  const pos = comboHighlight[fieldId];
  const idxList = comboFiltered[fieldId] || [];
  if (pos === undefined || pos < 0 || pos >= idxList.length) return;
  selectCombo(fieldId, idxList[pos]);
}

// 搜尋框的鍵盤事件：↑↓ 移動反白、Enter 選取、Esc 關閉
function handleComboKeydown(e, fieldId) {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    moveComboHighlight(fieldId, 1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    moveComboHighlight(fieldId, -1);
  } else if (e.key === "Enter") {
    e.preventDefault();
    selectComboHighlighted(fieldId);
  } else if (e.key === "Escape") {
    e.preventDefault();
    closeAllCombos();
  }
}

function updateComboLabel(fieldId, o) {
  const labelEl = document.getElementById(fieldId + "_label");
  if (!labelEl) return;
  if (o) {
    labelEl.textContent = o.primary;
    labelEl.classList.remove("text-slate-400");
    labelEl.classList.add("text-slate-700");
  } else {
    labelEl.textContent = "請選擇...";
    labelEl.classList.add("text-slate-400");
    labelEl.classList.remove("text-slate-700");
  }
}

function selectCombo(fieldId, idx) {
  const o = (comboStore[fieldId] || [])[idx];
  if (!o) return;
  const input = document.getElementById(fieldId);
  if (input) input.value = o.value;
  updateComboLabel(fieldId, o);
  closeAllCombos();
}

// 讓程式可以像操作 <select> 一樣，用 .value 設定目前選取的值(例如打開編輯 Modal 時)
function setComboValue(fieldId, value) {
  const input = document.getElementById(fieldId);
  if (input) input.value = value || "";
  const found = (comboStore[fieldId] || []).find(item => item.value === value);
  updateComboLabel(fieldId, found || (value ? { primary: value } : null));
}

function toggleCombo(fieldId, btn) {
  const panel = document.getElementById(fieldId + "_panel");
  if (!panel) return;
  const willOpen = panel.classList.contains("hidden");
  closeAllCombos();
  if (!willOpen) return;

  renderComboList(fieldId, "");
  const rect = btn.getBoundingClientRect();
  panel.classList.remove("hidden");
  panel.style.left = Math.max(8, rect.left) + "px";
  panel.style.width = Math.max(rect.width, 260) + "px";

  // 動態判斷上下空間，空間不夠時自動往上展開，不會被畫面邊緣(或工作列)擋住
  const panelHeight = panel.offsetHeight || 280;
  const spaceBelow = window.innerHeight - rect.bottom;
  const spaceAbove = rect.top;
  if (spaceBelow < panelHeight + 12 && spaceAbove > spaceBelow) {
    panel.style.top = Math.max(8, rect.top - panelHeight - 6) + "px";
  } else {
    panel.style.top = (rect.bottom + 6) + "px";
  }

  const searchInput = panel.querySelector(".combo-search");
  if (searchInput) { searchInput.value = ""; searchInput.focus(); }
}

function closeAllCombos() {
  document.querySelectorAll(".combo-panel").forEach(p => p.classList.add("hidden"));
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".combo-field")) closeAllCombos();
});
window.addEventListener("resize", closeAllCombos);
document.addEventListener("scroll", (e) => {
  // 💡 面板內部的滾動(滑鼠滾輪捲動清單)不應該把選單關掉，只有「頁面本身」捲動時才關閉
  const target = e.target;
  if (target && target.nodeType === 1 && target.closest(".combo-panel")) return;
  closeAllCombos();
}, true);

// ========================================================================
// 💡 處理軌跡 (History Log) 美化渲染
// ========================================================================

// 幫某個狀態文字配色 + icon，讓時間軸的圓點與標籤顏色一致
function logStatusColor(statusText) {
  const s = statusText || "";
  if (s.includes("結案")) return { dot: "bg-emerald-500", badge: "bg-emerald-50 text-emerald-600", icon: "✅" };
  if (s.includes("作廢")) return { dot: "bg-slate-400", badge: "bg-slate-100 text-slate-500", icon: "🗑️" };
  if (s.includes("待處理")) return { dot: "bg-rose-500", badge: "bg-rose-50 text-rose-600", icon: "⏳" };
  if (s) return { dot: "bg-amber-500", badge: "bg-amber-50 text-amber-600", icon: "🔧" };
  return { dot: "bg-slate-300", badge: "", icon: "" };
}

// 把 Google Sheets 存的原始 LOG 字串，拆解成一筆一筆的紀錄物件
function parseHistoryLog(rawLog) {
  if (!rawLog) return [];
  const lines = rawLog.split('\n').map(l => l.trim()).filter(Boolean);
  const headerRe = /^\[(.+?)\]\s*(.*)$/;
  const entries = [];
  let current = null;

  lines.forEach(line => {
    const m = line.match(headerRe);
    if (m) {
      if (current) entries.push(current);
      current = { time: m[1], headline: m[2], notes: [] };
    } else if (current) {
      current.notes.push(line.replace(/^[└─\-]\s*/, '').replace(/^說明[:：]\s*/, ''));
    }
  });
  if (current) entries.push(current);

  const knownStatuses = ["結案", "已作廢", "待處理", "進行中", "等回覆", "卡關"];
  entries.forEach(e => {
    let badge = "";
    let m2 = e.headline.match(/→\s*([^\s。，,]+)/);
    if (m2) badge = m2[1];
    if (!badge) {
      m2 = e.headline.match(/狀態[:：]\s*([^\s。，,)）]+)/);
      if (m2) badge = m2[1];
    }
    if (!badge) {
      m2 = e.headline.match(/變更為[:：]\s*([^\s。，,]+)/);
      if (m2) badge = m2[1];
    }
    if (!badge) {
      const found = knownStatuses.find(s => e.headline.includes(s));
      if (found) badge = found;
    }
    e.badge = badge;
  });

  return entries.reverse(); // 新到舊
}

// 把處理歷程渲染成漂亮的時間軸（圓點 + 時間 + 說明 + 狀態標籤）
function renderHistoryLog(rawLog) {
  const container = document.getElementById("detailLogList");
  const countEl = document.getElementById("detailLogCount");
  if (!container) return;

  const entries = parseHistoryLog(rawLog);
  if (countEl) countEl.textContent = entries.length;

  if (entries.length === 0) {
    container.innerHTML = '<div class="text-center text-xs text-slate-400 py-8">目前尚無處理歷程。</div>';
    return;
  }

  container.innerHTML = entries.map((entry, idx) => {
    const isLast = idx === entries.length - 1;
    const colors = logStatusColor(entry.badge);
    const noteHtml = entry.notes.length
      ? `<div class="text-xs text-slate-500 mt-1 leading-relaxed">${entry.notes.map(n => escapeHtml(n)).join('<br>')}</div>`
      : '';
    const badgeHtml = entry.badge
      ? `<span class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full ${colors.badge} whitespace-nowrap">${colors.icon ? colors.icon + ' ' : ''}${escapeHtml(entry.badge)}</span>`
      : '';

    return `
      <div class="relative pl-6 ${isLast ? '' : 'pb-4'}">
        ${isLast ? '' : `<div class="absolute left-[5px] top-3 bottom-0 w-px bg-slate-200"></div>`}
        <div class="absolute left-0 top-1.5 w-2.5 h-2.5 rounded-full ${colors.dot} ring-4 ring-white shadow-sm"></div>
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="text-xs font-bold text-slate-400">${escapeHtml(entry.time)}</div>
            <div class="text-sm text-slate-700 mt-0.5 leading-relaxed">${escapeHtml(entry.headline)}</div>
            ${noteHtml}
          </div>
          ${badgeHtml}
        </div>
      </div>
    `;
  }).join('');
}

// 儲存目前正在編輯的列數與歷史紀錄
let currentEditingRow = null;
let currentEditingLog = "";
let currentEditingOriginalStatus = ""; // 💡 記住打開 Modal 當下的狀態，用來組出「A → B」的變更紀錄

// 🟢 點擊「✏️ 處理」按鈕時：打開 Modal 並把資料塞進去
function openTaskDetail(rowIndex, status, logEnc, tagsEnc, catEnc, vendorEnc, contactEnc, sourceEnc, deadlineEnc, assigneeEnc) {
  currentEditingRow = rowIndex;
  currentEditingLog = decodeURIComponent(logEnc);
  currentEditingOriginalStatus = status;
  
  document.getElementById("detailStatus").value = status;
  document.getElementById("detailNote").value = ""; 
  document.getElementById("detailTags").value = tagsEnc ? decodeURIComponent(tagsEnc) : ""; 
  
  // 💡 寫入新欄位
  document.getElementById("detailCategory").value = decodeURIComponent(catEnc);
  document.getElementById("detailVendor").value = decodeURIComponent(vendorEnc);
  setComboValue("detailContact", decodeURIComponent(contactEnc));
  document.getElementById("detailSource").value = decodeURIComponent(sourceEnc);
 document.getElementById("detailAssignee").value = decodeURIComponent(assigneeEnc);
  
  // 處理日期格式 (HTML input type="date" 需要 YYYY-MM-DD)
  const dl = decodeURIComponent(deadlineEnc);
  document.getElementById("detailDeadline").value = dl ? dl.replace(/\//g, '-') : "";
  
  renderHistoryLog(currentEditingLog);
  document.getElementById("taskDetailModal").classList.remove("hidden");
}

// 🔴 關閉 Modal
function closeTaskDetailModal() {
  document.getElementById("taskDetailModal").classList.add("hidden");
  currentEditingRow = null;
  currentEditingLog = "";
}

// 💾 點擊 Modal 內的「儲存變更」按鈕
document.getElementById("saveDetailBtn").addEventListener("click", async () => {
  if (!currentEditingRow) return;
  
  const newStatus = document.getElementById("detailStatus").value;
  const note = document.getElementById("detailNote").value.trim();
  const tags = document.getElementById("detailTags").value.trim();
  
  const newCat = document.getElementById("detailCategory").value;
  const newVendor = document.getElementById("detailVendor").value;
  const newContact = document.getElementById("detailContact").value;
  const newSource = document.getElementById("detailSource").value;
  let newDeadline = document.getElementById("detailDeadline").value;
  if (newDeadline) newDeadline = newDeadline.replace(/-/g, '/');
  
  // 💡 確保處理人也有被抓取到
  const newAssignee = document.getElementById("detailAssignee").value; 
  
  const btn = document.getElementById("saveDetailBtn");
  const originalText = btn.textContent;
  btn.textContent = "儲存中...";
  btn.disabled = true;

  // 呼叫更新 API (將所有參數傳入)
  await updateTaskDetailAPI(currentEditingRow, newStatus, currentEditingOriginalStatus, note, currentEditingLog, tags, newCat, newVendor, newContact, newSource, newDeadline, newAssignee);
  
  btn.textContent = originalText;
  btn.disabled = false;
  closeTaskDetailModal();
});

// ⚙️ 核心 API：將狀態、說明、新 LOG 寫回 Google Sheets
async function updateTaskDetailAPI(rowIndex, newStatus, oldStatus, note, currentLog, tags, category, vendor, contact, source, deadline, assignee) {
  try {
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 💡 組出「狀態變更：A → B」的敘述，沒改變狀態則寫「狀態確認：A → A」，方便統一解析、上色
    const fromStatus = oldStatus || newStatus;
    const changeLabel = (fromStatus !== newStatus) ? "狀態變更" : "狀態確認";
    let newLogEntry = `[${timeString}] ${changeLabel}：${fromStatus} → ${newStatus}`;
    if (note) newLogEntry += `。備註：${note}`;
    const updatedLog = currentLog ? `${currentLog}\n\n${newLogEntry}` : newLogEntry;

    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!B${rowIndex}:D${rowIndex}`, values: [[category, contact, source]] }, 
        { range: `案件總表!G${rowIndex}`, values: [[deadline]] }, 
        { range: `案件總表!I${rowIndex}:L${rowIndex}`, values: [[timeString, updatedLog, tags, vendor]] }, 
        { range: `案件總表!M${rowIndex}`, values: [[assignee]] } 
      ]
    };

    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: { 
        "Authorization": `Bearer ${accessToken}`, 
        "Content-Type": "application/json" 
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件紀錄更新成功！");
      loadTasksFromSheets(); 
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路異常，請查看 Console。");
  }
}
  
// ⚠️ 保留原本的刪除功能 (只需微調傳遞給 API 的方式)
async function deleteTask(rowIndex, logEncoded) {
  const confirmDelete = confirm("⚠️ 確定要刪除這筆案件嗎？\n(案件將會被標記為「已作廢」並從列表中隱藏)");
  if (!confirmDelete) return;
  
  // 刪除時不加說明，直接呼叫更新 API，狀態改為已作廢
  await updateSheetData(rowIndex, "已作廢", decodeURIComponent(logEncoded));
}


// ⚙️ 核心 API 呼叫：負責把更新的狀態、時間、日誌寫回 Google Sheets
async function updateSheetData(rowIndex, newStatus, currentLog) {
  try {
    // 1. 產生當下的時間戳記
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 2. 組合處理歷程紀錄
    const newLogEntry = `[${timeString}] 案件刪除（狀態變更：已作廢）`;
    const updatedLog = currentLog ? `${currentLog}\n${newLogEntry}` : newLogEntry;

    // 3. 打包要更新的資料 (使用 batchUpdate 可以一次更新多個不連續的欄位)
    // 我們要更新：A欄(狀態)、I欄(最後更新時間)、J欄(處理歷程)
    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!I${rowIndex}:J${rowIndex}`, values: [[timeString, updatedLog]] }
      ]
    };

    // 4. 發送請求給 Google Sheets
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件狀態更新成功！");
      loadTasksFromSheets(); // 重新載入畫面，讓畫面立刻反映最新結果
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路錯誤或系統異常，請查看 Console。");
  }
}

// 🔍 核心功能：根據多重核取方塊過濾表格內容
// 🔍 核心功能：根據下拉選單過濾表格內容
function applyFilter() {
   const checkedStatuses = Array.from(document.querySelectorAll('.filter-status-cb:checked')).map(cb => cb.value);
  const filterCategory = document.getElementById('filterCategory').value;
  const filterVendor = document.getElementById('filterVendor').value;
  const filterAssignee = document.getElementById('filterAssignee').value;
 
  const rows = document.querySelectorAll("#taskTableBody tr");

  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;

    // 抓取各欄位的文字 (根據 HTML th 排列順序：第1欄狀態, 第2欄類別, 第3欄廠商, 第5欄處理人)
    const statusText = row.querySelector("td:nth-child(1) span").textContent;
    const categoryText = row.querySelector("td:nth-child(2)").textContent;
    const vendorText = row.querySelector("td:nth-child(3)").textContent; 
    const assigneeText = row.querySelector("td:nth-child(5)").textContent; 

    // 判斷邏輯：如果是「全部」，代表該條件過關；否則文字必須包含選擇的字眼
    const matchStatus = checkedStatuses.some(status => statusText.includes(status));
    const matchCategory = (filterCategory === "全部") || (categoryText === filterCategory);
    const matchVendor = (filterVendor === "全部") || (vendorText === filterVendor);
    const matchAssignee = (filterAssignee === "全部") || (assigneeText === filterAssignee);

    // 四個條件都必須符合才顯示
    if (matchStatus && matchCategory && matchVendor && matchAssignee) {
      row.style.display = ""; 
    } else {
      row.style.display = "none"; 
    }
  });
}
  
// 點擊儀表板時觸發的過濾器
function filterByDashboard(type) {
  const rows = document.querySelectorAll("#taskTableBody tr");
  
  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;
    
    const status = row.getAttribute("data-status");
    const isUrgent = row.getAttribute("data-urgent");
    
    if (type === '急件' && isUrgent === 'yes') row.style.display = "";
    else if (type === '待處理' && status.includes('待處理')) row.style.display = "";
    else if (type === '進行中' && status.includes('進行中')) row.style.display = "";
    else if (type === '卡關' && (status.includes('卡關') || status.includes('等回覆'))) row.style.display = "";
    else row.style.display = "none";
  });
}

// 1. 打開或關閉指定的下拉選單
function toggleDropdown(menuId) {
  // 先把其他所有選單關掉，再切換點擊的這個
  const allMenus = ['statusMenu', 'categoryMenu', 'vendorMenu', 'assigneeMenu'];
  allMenus.forEach(id => {
    if (id !== menuId) document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(menuId).classList.toggle('hidden');
}

// 2. 通用的：更新按鈕上的「已選數量」文字
function updateDropdownBtn(type, labelName) {
  const checkboxes = document.querySelectorAll(`.filter-${type}-cb`);
  const checkedBoxes = document.querySelectorAll(`.filter-${type}-cb:checked`);
  const btnText = document.getElementById(`${type}BtnText`);
  
  if (checkedBoxes.length === checkboxes.length) {
    btnText.textContent = `${labelName} (全部)`;
  } else if (checkedBoxes.length === 0) {
    btnText.textContent = `${labelName} (未選)`;
  } else {
    btnText.textContent = `${labelName} (已選 ${checkedBoxes.length})`;
  }
}

// 3. 通用的：全選 / 清除功能
function selectAllOptions(type, labelName) {
  const checkboxes = document.querySelectorAll(`.filter-${type}-cb`);
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  
  checkboxes.forEach(cb => cb.checked = !allChecked);
  updateDropdownBtn(type, labelName);
  applyFilter();
}

// 4. 點擊網頁其他空白處，自動收起所有下拉選單
document.addEventListener('click', function(event) {
  const dropdowns = ['status', 'category', 'vendor', 'assignee'];
  dropdowns.forEach(type => {
    const wrap = document.getElementById(`${type}Dropdown`);
    const menu = document.getElementById(`${type}Menu`);
    // 如果點擊的地方不在該選單範圍內，就把它隱藏
    if (wrap && !wrap.contains(event.target)) {
      menu.classList.add('hidden');
    }
  });
});

// 🔍 5. 更新為支援四組陣列的 applyFilter
function applyFilter() {
  // 抓取四大過濾器中「有被打勾」的值，存成陣列
  const checkedStatuses = Array.from(document.querySelectorAll('.filter-status-cb:checked')).map(cb => cb.value);
  const checkedCategories = Array.from(document.querySelectorAll('.filter-category-cb:checked')).map(cb => cb.value);
  const checkedVendors = Array.from(document.querySelectorAll('.filter-vendor-cb:checked')).map(cb => cb.value);
  const checkedAssignees = Array.from(document.querySelectorAll('.filter-assignee-cb:checked')).map(cb => cb.value);

  const rows = document.querySelectorAll("#taskTableBody tr");

  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;

    const statusText = row.querySelector("td:nth-child(1) span").textContent;
    const categoryText = row.querySelector("td:nth-child(2)").textContent;
    const vendorText = row.querySelector("td:nth-child(3)").textContent; 
    const assigneeText = row.querySelector("td:nth-child(5)").textContent; 

    // 比對文字是否存在於被勾選的陣列中
    const matchStatus = checkedStatuses.some(status => statusText.includes(status));
    const matchCategory = checkedCategories.includes(categoryText);
    const matchVendor = checkedVendors.includes(vendorText);
    const matchAssignee = checkedAssignees.includes(assigneeText);

    // 四個條件都符合才顯示
    if (matchStatus && matchCategory && matchVendor && matchAssignee) {
      row.style.display = ""; 
    } else {
      row.style.display = "none"; 
    }
  });
}
