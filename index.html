 
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專屬雜事追蹤管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; background-color: #f1f5f9; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="text-slate-800 min-h-screen">

<!-- 頂部導覽列 -->
<header class="bg-[#1e293b] text-white shadow-md sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-blue-500 p-1.5 rounded-lg">🛡️</div>
      <h1 class="text-lg font-bold tracking-wider">專屬雜事追蹤管理系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="userStatus" class="text-xs text-slate-300"></span>
      <button id="loginBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 transition">☁️ 雲端同步登入</button>
      <button id="logoutBtn" class="hidden px-4 py-2 rounded-md bg-slate-700 text-slate-200 text-sm font-bold hover:bg-slate-600 transition">登出</button>
      <button id="openModalBtn" class="hidden px-4 py-2 rounded-md bg-emerald-500 text-white text-sm font-bold hover:bg-emerald-600 transition shadow-sm">+ 新增案件</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 mt-6">
  
  <!-- 四大狀態卡片 (儀表板) -->
  <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div onclick="filterByDashboard('急件')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-500 text-2xl">🚨</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">今日急件</p>
        <p id="countUrgent" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('待處理')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 text-2xl">📥</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">待處理清單</p>
        <p id="countTodo" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('進行中')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-2xl">🏃</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">處理/盤點中</p>
        <p id="countDoing" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div onclick="filterByDashboard('卡關')" class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center text-purple-500 text-2xl">🤝</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">卡關/等回覆</p>
        <p id="countWaiting" class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
  </section>

  <!-- 案件資料表區域 -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200">
    
    <!-- 頂部過濾器與按鈕區塊 -->
    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      
      <!-- 💡 左側：篩選器群組 (透過 flex 和 gap-3 讓它們橫向、整齊排列) -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- 1. 狀態篩選 -->
        <div class="relative" id="statusDropdown">
          <button onclick="toggleDropdown('statusMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="statusBtnText">狀態 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="statusMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇狀態</span>
              <button onclick="selectAllOptions('status', '狀態')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div class="max-h-48 overflow-y-auto p-1">
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="待處理" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full text-xs font-bold">待處理</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="進行中" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full text-xs font-bold">進行中</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="卡關" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full text-xs font-bold">卡關</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="等回覆" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full text-xs font-bold">等回覆</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="結案" class="filter-status-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('status', '狀態'); applyFilter()"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full text-xs font-bold">結案</span></label>
            </div>
          </div>
        </div>

        <!-- 2. 類別篩選 -->
        <div class="relative" id="categoryDropdown">
          <button onclick="toggleDropdown('categoryMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="categoryBtnText">類別 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="categoryMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇類別</span>
              <button onclick="selectAllOptions('category', '類別')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div id="categoryFilterList" class="max-h-48 overflow-y-auto p-1">
              <div class="text-center text-xs text-slate-400 py-2">載入中...</div>
            </div>
          </div>
        </div>

        <!-- 3. 廠商篩選 -->
        <div class="relative" id="vendorDropdown">
          <button onclick="toggleDropdown('vendorMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="vendorBtnText">廠商 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="vendorMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇廠商</span>
              <button onclick="selectAllOptions('vendor', '廠商')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div class="max-h-48 overflow-y-auto p-1">
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="DMS" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">DMS</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="三商" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">三商</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="迪堡多富" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">迪堡多富</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="國眾" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">國眾</span></label>
              <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer"><input type="checkbox" value="無" class="filter-vendor-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('vendor', '廠商'); applyFilter()"><span class="text-sm font-medium text-slate-700">無 / 內部</span></label>
            </div>
          </div>
        </div>

        <!-- 4. 處理人篩選 -->
        <div class="relative" id="assigneeDropdown">
          <button onclick="toggleDropdown('assigneeMenu')" class="border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 bg-white flex justify-between items-center w-40 hover:bg-slate-50 transition">
            <span id="assigneeBtnText">處理人 (全部)</span>
            <span class="text-slate-400 text-xs">▼</span>
          </button>
          <div id="assigneeMenu" class="hidden absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1">
            <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center">
              <span class="text-xs font-bold text-slate-500">選擇處理人</span>
              <button onclick="selectAllOptions('assignee', '處理人')" class="text-xs text-blue-600 hover:text-blue-800 font-bold">全選/清除</button>
            </div>
            <div id="assigneeFilterList" class="max-h-48 overflow-y-auto p-1">
              <div class="text-center text-xs text-slate-400 py-2">載入中...</div>
            </div>
          </div>
        </div>
        
      </div> <!-- /結束左側篩選器群組 -->

      <!-- 右側：匯出按鈕 -->
      <button class="px-3 py-1.5 text-sm font-bold text-emerald-600 bg-emerald-50 rounded-md hover:bg-emerald-100">📥 匯出 Excel</button>
      
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200">
            <th class="px-6 py-4 font-bold whitespace-nowrap">狀態</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap">專案類別</th>
            <th class="px-6 py-4 font-bold text-indigo-600 whitespace-nowrap">負責廠商</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap">聯絡人</th>
            <th class="px-6 py-4 font-bold text-blue-600 whitespace-nowrap">處理人</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap">任務來源</th>
            <!-- 💡 任務摘要保留彈性，並設定最小寬度避免被擠太扁 -->
            <th class="px-6 py-4 font-semibold text-left min-w-[200px]">任務摘要</th>
            <th class="px-6 py-4 font-semibold text-left whitespace-nowrap">標籤</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap">最後期限</th>
            <th class="px-6 py-4 font-bold whitespace-nowrap">最後更新</th>
            <th class="px-6 py-4 font-semibold text-center whitespace-nowrap">操作</th>
          </tr>
        </thead>
        <tbody id="taskTableBody" class="text-sm divide-y divide-slate-100">
          <tr>
            <td colspan="6" class="px-6 py-10 text-center text-slate-400">請先登入以載入資料...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- 新增案件 Modal 表單 -->
<div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center">
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h2 class="text-lg font-bold text-slate-800">新增追蹤案件</h2>
      <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
    </div>
    <div class="p-6 grid grid-cols-2 gap-4">
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">專案類別 (來自 Google Sheets)</label>
        <select id="categorySelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">負責廠商</label>
        <select id="vendorSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="無">無 / 內部處理</option>
          <option value="DMS">DMS</option>
          <option value="三商">三商</option>
          <option value="迪堡多富">迪堡多富</option>
          <option value="國眾">國眾</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">聯絡人 (來自 Google Sheets)</label>
        <select id="contactSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
     <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">處理人 (來自 Google Sheets)</label>
        <select id="newTaskAssignee" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務來源 (來自 Google Sheets)</label>
        <select id="taskSource" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
       </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">最後期限</label>
        <input type="date" id="newTaskDeadline" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700">
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">🏷️ 案件標籤 (逗號分隔)</label>
        <input type="text" id="newTaskTags" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 placeholder-slate-400" placeholder="例如：VIP, 急件">
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務摘要</label>
        <input type="text" id="taskTitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-blue-500" placeholder="一句話描述這個任務...">
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-500 mb-1">詳細說明與網址</label>
        <textarea id="taskDetails" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 resize-none" placeholder="貼上表單連結、錯誤訊息或備註..."></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
      <button id="cancelBtn" class="px-4 py-2 rounded-lg text-slate-600 font-bold hover:bg-slate-200 text-sm">取消</button>
      <button id="saveTaskBtn" class="px-5 py-2 rounded-lg bg-blue-600 text-white font-bold hover:bg-blue-700 text-sm shadow-sm">儲存案件</button>
    </div>
  </div>
</div>

  <!-- 案件處理與紀錄 Modal -->
<div id="taskDetailModal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- 標題區 -->
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="font-bold text-lg text-slate-800">📝 案件處理與紀錄</h3>
      <button onclick="closeTaskDetailModal()" class="text-slate-400 hover:text-rose-500 transition text-xl font-bold">&times;</button>
    </div>
    
    <!-- 內容區 -->
    <div class="p-6 overflow-y-auto flex-1 space-y-5">
      <!-- 狀態修改 -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">更新案件狀態</label>
        <select id="detailStatus" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 font-medium">
          <option value="待處理">待處理</option>
          <option value="進行中">進行中</option>
          <option value="等回覆">等回覆</option>
          <option value="卡關">卡關</option>
          <option value="結案">結案</option>
        </select>
      </div>
      <!-- 💡 新增：可修改的詳細資料 -->
      <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-100">
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-xs font-bold text-slate-600 mb-1">專案類別</label>
          <select id="detailCategory" class="w-full border border-slate-200 rounded text-sm px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500"></select>
        </div>
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-xs font-bold text-slate-600 mb-1">負責廠商</label>
          <select id="detailVendor" class="w-full border border-slate-200 rounded text-sm px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500">
            <option value="無">無 / 內部處理</option>
            <option value="DMS">DMS</option>
            <option value="三商">三商</option>
            <option value="迪堡多富">迪堡多富</option>
            <option value="國眾">國眾</option>
          </select>
        </div>
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-xs font-bold text-slate-600 mb-1">聯絡人</label>
          <select id="detailContact" class="w-full border border-slate-200 rounded text-sm px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500"></select>
        </div>
       <div class="col-span-2 sm:col-span-1">
          <label class="block text-xs font-bold text-slate-600 mb-1">處理人</label>
          <select id="detailAssignee" class="w-full border border-slate-200 rounded text-sm px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500"></select>
        </div>
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-xs font-bold text-slate-600 mb-1">任務來源</label>
          <select id="detailSource" class="w-full border border-slate-200 rounded text-sm px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500"></select>
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-bold text-slate-600 mb-1">最後期限</label>
          <input type="date" id="detailDeadline" class="w-full border border-slate-200 rounded text-sm px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500 text-slate-700">
        </div>
      </div>
      <!-- 標籤修改 -->

<script>
/* === 請換成你的 Client ID === */
const CLIENT_ID = "370645265767-phukpstpp7prf0ioh2tt6khc6dchk015.apps.googleusercontent.com";
// 擴充權限：加入 Google Sheets API 的讀寫權限
const SCOPES = "https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/spreadsheets";

const SPREADSHEET_ID = "1Q7ncYV9-a_Vl54spHHH96x_FunVlf15QNLIbARJahq4";

let accessToken = null;

// Modal 控制邏輯

window.addEventListener("load", () => {
  // 1. 網頁載入時，先去 localStorage 找找看有沒有之前存下來的 Token
  const savedToken = localStorage.getItem("google_access_token");
  if (savedToken) {
    accessToken = savedToken;

  // 2. 初始化 Google 登入客戶端
  tokenClient = google.accounts.oauth2.initTokenClient({

    callback: (resp) => {
      if (resp.error) return alert("登入失敗：" + resp.error);
      accessToken = resp.access_token;
      
      // 💡 關鍵新增：登入成功後，把 Token 存進瀏覽器！
      localStorage.setItem("google_access_token", accessToken);
      
      setLoggedInUI(true);
      loadSettingsFromSheets();

  });

  // 3. 綁定按鈕
  document.getElementById("loginBtn").addEventListener("click", () => tokenClient.requestAccessToken({ prompt: "consent" }));
  
  document.getElementById("logoutBtn").addEventListener("click", () => {

    localStorage.removeItem("google_access_token");

      google.accounts.oauth2.revoke(accessToken, () => { 
        accessToken = null;

// 核心功能：從 Google Sheets 抓取自訂選項
async function loadSettingsFromSheets() {
try {
    // 💡 1. 增加抓取 I 欄 (處理人清單)
    const [catRes, contactRes, sourceRes, assigneeRes] = await Promise.all([
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!A2:A`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!C2:E`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!G2:G`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!I2:I`, { headers: { Authorization: `Bearer ${accessToken}` } })
    ]);

    const catData = await catRes.json();
    const contactData = await contactRes.json();
    const sourceData = await sourceRes.json();
    const assigneeData = await assigneeRes.json();

    // 💡 2. 更新「專案類別」選單 (包含篩選器)
    const catSelect = document.getElementById("categorySelect");
    const detailCatSelect = document.getElementById("detailCategory");
    const filterCatSelect = document.getElementById("filterCategory");
    let catOptions = '<option value="全部">全部類別</option>'; // 篩選器用的預設
    let formCatOptions = '<option value="">請選擇...</option>'; // 表單用的預設
    let filterCatHtml = ''; // 準備塞給篩選器的 HTML
 
    if (catData.values) {
      catData.values.forEach(row => {
        if(row[0]) {
          // 給新增與編輯的表單用 (維持 option)

          // 給新的多選篩選器用 (產生 checkbox)

              <span class="text-sm font-medium text-slate-700">${row[0]}</span>
            </label>`;
        }
      });
    }
    catSelect.innerHTML = formCatOptions;
    detailCatSelect.innerHTML = formCatOptions;
    document.getElementById("categoryFilterList").innerHTML = filterCatHtml;
    updateDropdownBtn('category', '類別'); // 更新按鈕文字

    // 3. 更新「聯絡人」選單
    const contactSelect = document.getElementById("contactSelect");
    const detailContactSelect = document.getElementById("detailContact");
    let contactOptions = '<option value="">請選擇...</option>';
    if (contactData.values) {
      contactData.values.forEach(row => {
        if(row[0]) {
          const ext = row[1] ? ` (分機: ${row[1]})` : '';

    contactSelect.innerHTML = contactOptions;
    detailContactSelect.innerHTML = contactOptions; // 💡 同時更新給處理 Modal

    // 4. 更新「任務來源」選單 (新加入的邏輯)
    const sourceSelect = document.getElementById("taskSource");
    const detailSourceSelect = document.getElementById("detailSource"); // 💡 新增
    let sourceOptions = '<option value="">請選擇...</option>';
    
    if (sourceData.values) {
      sourceData.values.forEach(row => {
        if(row[0]) sourceOptions += `<option value="${row[0]}">${row[0]}</option>`;
      });
    }
    sourceSelect.innerHTML = sourceOptions;
    detailSourceSelect.innerHTML = sourceOptions; // 💡 同時更新給處理 Modal
    
    // 💡 5. 更新「處理人」選單
    const assigneeSelect = document.getElementById("newTaskAssignee");
    const detailAssigneeSelect = document.getElementById("detailAssignee");
    const filterAssigneeSelect = document.getElementById("filterAssignee");
    let assigneeOptions = '<option value="全部">全部處理人</option>';
    let formAssigneeOptions = '<option value="">請選擇...</option>';
    let filterAssigneeHtml = '';
    
    if (assigneeData.values) {
      assigneeData.values.forEach(row => {
        if(row[0]) {
          formAssigneeOptions += `<option value="${row[0]}">${row[0]}</option>`;
          filterAssigneeHtml += `
            <label class="flex items-center gap-2 px-2 py-2 hover:bg-slate-50 rounded cursor-pointer">
              <input type="checkbox" value="${row[0]}" class="filter-assignee-cb w-4 h-4 rounded text-blue-600" checked onchange="updateDropdownBtn('assignee', '處理人'); applyFilter()">

// 綁定儲存按鈕的點擊事件
document.getElementById("saveTaskBtn").addEventListener("click", saveTaskToSheets);

async function saveTaskToSheets() {
  if (!accessToken) return alert("請先登入！");

  const category = document.getElementById("categorySelect").value;
  const vendor = document.getElementById("vendorSelect").value;      // 💡 抓取廠商
  const assignee = document.getElementById("newTaskAssignee").value; // 💡 抓處理人
  const contact = document.getElementById("contactSelect").value;
  const source = document.getElementById("taskSource").value;        // 💡 抓任務來源
  const title = document.getElementById("taskTitle").value;
  const newTags = document.getElementById("newTaskTags").value.trim();
  let newDeadline = document.getElementById("newTaskDeadline").value;
  if (newDeadline) newDeadline = newDeadline.replace(/-/g, '/'); // 轉換成 YYYY/MM/DD 格式
  const details = document.getElementById("taskDetails").value;
  
  if (!title) return alert("任務摘要不能是空的喔！");

  const now = new Date().toLocaleString('zh-TW');
  
  // 2. 依照試算表的 A~I 欄位順序排好陣列
  const rowData = [
    "待處理", category, contact, source, title, details, newDeadline, now, now, "", newTags, vendor,
    assignee // 💡 塞入第13格 (M欄)
  ];

  try {
    // 3. 網址最後的範圍從 A:I 改成 A:M
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/案件總表!A:M:append?valueInputOption=USER_ENTERED`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ values: [rowData] })
    });

    const result = await response.json();
    
    if (result.updates) {
      alert("✅ 案件儲存成功！");
      document.getElementById("newTaskTags").value = "";
      document.getElementById("newTaskDeadline").value = "";
      document.getElementById("taskSource").value = ""; // 清空新增的欄位
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDetails").value = "";
      modal.classList.add("hidden");

      loadTasksFromSheets(); // 儲存成功後自動重新整理表格！
    } else {
      console.error("儲存失敗:", result);
    }
  } catch (error) {
    console.error("發生錯誤:", error);
  }
}
// 核心功能：從 Google Sheets 讀取案件總表並顯示在畫面上
async function loadTasksFromSheets() {
  try {
    // 💡 抓取範圍延伸到 M 欄 (標籤)
    const range = encodeURIComponent("案件總表!A2:M");
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`, {
      headers: { Authorization: `Bearer ${accessToken}` },
      cache: "no-store" 
    });
    
    if (response.status === 401) return alert("⚠️ 憑證過期，請重新登入！");
    const data = await response.json();
    const tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = ""; 

    if (!data.values || data.values.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-10 text-center text-slate-400">目前沒有任何案件！</td></tr>';
      return;
    }

    const rowsWithIndex = data.values.map((row, index) => ({ rowData: row, rowIndex: index + 2 }));
    const validRows = rowsWithIndex.filter(item => item.rowData.length > 0 && item.rowData[0] !== "");
    const rows = validRows.reverse(); 
    
    let urgentCount = 0, todoCount = 0, doingCount = 0, waitingCount = 0;
    
    // 💡 取得今天的日期 (格式：YYYY/MM/DD) 以判斷今日急件
    const today = new Date();
    const todayStr = `${today.getFullYear()}/${(today.getMonth()+1).toString().padStart(2,'0')}/${today.getDate().toString().padStart(2,'0')}`;
    
    rows.forEach(item => {
      const row = item.rowData;
      const rowIndex = item.rowIndex; 
      const status = row[0] || "未定";
      
      if (status === "已作廢") return;

      const category = row[1] || "";
      const contact = row[2] || "";
      const source = row[3] || "";
      const title = row[4] || "";
      const deadline = row[6] || "";
      const lastUpdate = row[8] || row[7] || ""; 
      const historyLog = row[9] || ""; 
      const tags = row[10] || ""; // 💡 抓取 K 欄的標籤
      const vendor = row[11] || "無"; // 💡 抓取 L 欄，舊案件如果沒有填就顯示「無」
      const assignee = row[12] || ""; // 💡 抓 M 欄處理人
     
      // 💡 統計邏輯升級：只有「死線小於等於今天」且「未結案」才算今日急件！
      if (status.includes("待處理")) todoCount++;
      if (status.includes("進行中")) doingCount++;
      if (status.includes("卡關") || status.includes("等回覆")) waitingCount++;
      if (deadline !== "" && deadline <= todayStr && !status.includes("結案")) urgentCount++; 

      let statusColor = "bg-slate-100 text-slate-600";
      if (status.includes("待處理")) statusColor = "bg-amber-100 text-amber-700";
      else if (status.includes("進行中")) statusColor = "bg-blue-100 text-blue-700";
      else if (status.includes("結案")) statusColor = "bg-emerald-100 text-emerald-700";

      // 💡 渲染標籤：把逗號分隔的文字，變成一顆顆的 HTML 標籤
      let tagsHtml = "";
      if (tags) {
        tagsHtml = tags.split(',').map(t => `<span class="inline-block bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full text-xs font-medium mr-1 mb-1">${t.trim()}</span>`).join('');
      }

      const logEncoded = encodeURIComponent(historyLog);
      // 傳遞給 Modal 時，多傳一個標籤參數
      const tagsEncoded = encodeURIComponent(tags); 
      // 💡 在渲染按鈕前，先把所有要帶入 Modal 的資料打包編碼
      const encLog = encodeURIComponent(historyLog);
      const encTags = encodeURIComponent(tags);
      const encCat = encodeURIComponent(category);
      const encVendor = encodeURIComponent(vendor);
      const encContact = encodeURIComponent(contact);
      const encSource = encodeURIComponent(source);
      const encDeadline = encodeURIComponent(deadline);
      const encAssignee = encodeURIComponent(assignee);
      
      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-0" data-status="${status}" data-urgent="${(deadline !== "" && deadline <= todayStr && !status.includes("結案")) ? 'yes' : 'no'}">
          <td class="px-6 py-3"><span class="px-2 py-1 rounded-md text-xs font-bold ${statusColor}">${status}</span></td>
          <td class="px-6 py-3 font-medium text-slate-700">${category}</td>
          <td class="px-6 py-3 font-bold text-indigo-600">${vendor}</td>
          <td class="px-6 py-3 text-slate-600">${contact}</td>
          <td class="px-6 py-3 font-bold text-blue-600">${assignee}</td>
          <td class="px-6 py-3 text-slate-400 text-xs">${source}</td>
          <td class="px-6 py-3 font-bold text-slate-800">${title}</td>
          <td class="px-6 py-3">${tagsHtml}</td> 
          <td class="px-6 py-3 text-rose-500 font-medium text-sm">${deadline || "-"}</td>
          <td class="px-6 py-3 text-xs text-slate-400">${lastUpdate}</td>
          <td class="px-6 py-3 text-center space-x-2">
            <button onclick="openTaskDetail(${rowIndex}, '${status}', '${encLog}', '${encTags}', '${encCat}', '${encVendor}', '${encContact}', '${encSource}', '${encDeadline}', '${encAssignee}')" class="...">✏️ 處理</button>
            <button onclick="deleteTask(${rowIndex}, '${logEncoded}')" class="...">🗑️ 刪除</button>
          </td>
        </tr>
      `;
    });
    
    if (document.getElementById("countUrgent")) document.getElementById("countUrgent").textContent = urgentCount;
    if (document.getElementById("countTodo")) document.getElementById("countTodo").textContent = todoCount;
    if (document.getElementById("countDoing")) document.getElementById("countDoing").textContent = doingCount;
    if (document.getElementById("countWaiting")) document.getElementById("countWaiting").textContent = waitingCount;

    if (typeof applyFilter === "function") applyFilter();
  } catch (error) {
    console.error("載入失敗:", error);
  }
}

// 儲存目前正在編輯的列數與歷史紀錄
let currentEditingRow = null;
let currentEditingLog = "";

// 🟢 點擊「✏️ 處理」按鈕時：打開 Modal 並把資料塞進去
function openTaskDetail(rowIndex, status, logEnc, tagsEnc, catEnc, vendorEnc, contactEnc, sourceEnc, deadlineEnc, assigneeEnc) {
  currentEditingRow = rowIndex;
  currentEditingLog = decodeURIComponent(logEnc);
  
  document.getElementById("detailStatus").value = status;
  document.getElementById("detailNote").value = ""; 
  document.getElementById("detailTags").value = tagsEnc ? decodeURIComponent(tagsEnc) : ""; 
  
  // 💡 寫入新欄位
  document.getElementById("detailCategory").value = decodeURIComponent(catEnc);
  document.getElementById("detailVendor").value = decodeURIComponent(vendorEnc);
  document.getElementById("detailContact").value = decodeURIComponent(contactEnc);
  document.getElementById("detailSource").value = decodeURIComponent(sourceEnc);
 document.getElementById("detailAssignee").value = decodeURIComponent(assigneeEnc);
  
  // 處理日期格式 (HTML input type="date" 需要 YYYY-MM-DD)
  const dl = decodeURIComponent(deadlineEnc);
  document.getElementById("detailDeadline").value = dl ? dl.replace(/\//g, '-') : "";
  
  document.getElementById("detailLog").textContent = currentEditingLog || "目前尚無處理歷程。";
  document.getElementById("taskDetailModal").classList.remove("hidden");
}

// 🔴 關閉 Modal
function closeTaskDetailModal() {
  document.getElementById("taskDetailModal").classList.add("hidden");
  currentEditingRow = null;
  currentEditingLog = "";
}

// 💾 點擊 Modal 內的「儲存變更」按鈕
document.getElementById("saveDetailBtn").addEventListener("click", async () => {
  if (!currentEditingRow) return;
  
  const newStatus = document.getElementById("detailStatus").value;
  const note = document.getElementById("detailNote").value.trim();
  const tags = document.getElementById("detailTags").value.trim();
  
  // 💡 抓取編輯後的新資料
  const newCat = document.getElementById("detailCategory").value;
  const newVendor = document.getElementById("detailVendor").value;
  const newContact = document.getElementById("detailContact").value;
  const newSource = document.getElementById("detailSource").value;
  const newAssignee = document.getElementById("detailAssignee").value;
  let newDeadline = document.getElementById("detailDeadline").value;
  if (newDeadline) newDeadline = newDeadline.replace(/-/g, '/');
  
  // 讓按鈕顯示「儲存中」防止重複點擊
  const btn = document.getElementById("saveDetailBtn");
  const originalText = btn.textContent;
  btn.textContent = "儲存中...";
  btn.disabled = true;

  // 呼叫更新 API
  await updateTaskDetailAPI(currentEditingRow, newStatus, note, currentEditingLog, tags, newCat, newVendor, newContact, newSource, newDeadline, newAssignee);
  
  // 恢復按鈕狀態並關閉 Modal
  btn.textContent = originalText;
  btn.disabled = false;
  closeTaskDetailModal();
});

// ⚙️ 核心 API：將狀態、說明、新 LOG 寫回 Google Sheets
// 💡 注意括號裡增加了參數
async function updateTaskDetailAPI(rowIndex, newStatus, note, currentLog, tags, category, vendor, contact, source, deadline, assignee) {
  try {
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    let newLogEntry = `[${timeString}] 狀態：${newStatus}`;
    if (note) newLogEntry += `\n └ 說明：${note}`; 
    const updatedLog = currentLog ? `${currentLog}\n\n${newLogEntry}` : newLogEntry;

    // 💡 打包資料：運用 batchUpdate 一次寫入多個不連續範圍！
    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!B${rowIndex}:D${rowIndex}`, values: [[category, contact, source]] },
        { range: `案件總表!G${rowIndex}`, values: [[deadline]] },
        { range: `案件總表!I${rowIndex}:L${rowIndex}`, values: [[timeString, updatedLog, tags, vendor]] },
        { range: `案件總表!M${rowIndex}`, values: [[assignee]] } // 💡 更新 M 欄
      ]
    };

    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件紀錄更新成功！");
      loadTasksFromSheets(); 
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路異常，請查看 Console。");
  }
}
  
// ⚠️ 保留原本的刪除功能 (只需微調傳遞給 API 的方式)
async function deleteTask(rowIndex, logEncoded) {
  const confirmDelete = confirm("⚠️ 確定要刪除這筆案件嗎？\n(案件將會被標記為「已作廢」並從列表中隱藏)");
  if (!confirmDelete) return;
  
  // 刪除時不加說明，直接呼叫更新 API，狀態改為已作廢
  await updateSheetData(rowIndex, "已作廢", decodeURIComponent(logEncoded));
}


// ⚙️ 核心 API 呼叫：負責把更新的狀態、時間、日誌寫回 Google Sheets
async function updateSheetData(rowIndex, newStatus, currentLog) {
  try {
    // 1. 產生當下的時間戳記
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 2. 組合處理歷程紀錄
    const newLogEntry = `[${timeString}] 變更為：${newStatus}`;
    const updatedLog = currentLog ? `${currentLog}\n${newLogEntry}` : newLogEntry;

    // 3. 打包要更新的資料 (使用 batchUpdate 可以一次更新多個不連續的欄位)
    // 我們要更新：A欄(狀態)、I欄(最後更新時間)、J欄(處理歷程)
    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!I${rowIndex}:J${rowIndex}`, values: [[timeString, updatedLog]] }
      ]
    };

    // 4. 發送請求給 Google Sheets
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件狀態更新成功！");
      loadTasksFromSheets(); // 重新載入畫面，讓畫面立刻反映最新結果
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路錯誤或系統異常，請查看 Console。");
  }
}

// 🔍 核心功能：根據多重核取方塊過濾表格內容
// 🔍 核心功能：根據下拉選單過濾表格內容
function applyFilter() {
   const checkedStatuses = Array.from(document.querySelectorAll('.filter-status-cb:checked')).map(cb => cb.value);
  const filterCategory = document.getElementById('filterCategory').value;
  const filterVendor = document.getElementById('filterVendor').value;
  const filterAssignee = document.getElementById('filterAssignee').value;
 
  const rows = document.querySelectorAll("#taskTableBody tr");

  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;

    // 抓取各欄位的文字 (根據 HTML th 排列順序：第1欄狀態, 第2欄類別, 第3欄廠商, 第5欄處理人)
    const statusText = row.querySelector("td:nth-child(1) span").textContent;
    const categoryText = row.querySelector("td:nth-child(2)").textContent;
    const vendorText = row.querySelector("td:nth-child(3)").textContent; 
    const assigneeText = row.querySelector("td:nth-child(5)").textContent; 

    // 判斷邏輯：如果是「全部」，代表該條件過關；否則文字必須包含選擇的字眼
    const matchStatus = checkedStatuses.some(status => statusText.includes(status));
    const matchCategory = (filterCategory === "全部") || (categoryText === filterCategory);
    const matchVendor = (filterVendor === "全部") || (vendorText === filterVendor);
    const matchAssignee = (filterAssignee === "全部") || (assigneeText === filterAssignee);

    // 四個條件都必須符合才顯示
    if (matchStatus && matchCategory && matchVendor && matchAssignee) {
      row.style.display = ""; 
    } else {
      row.style.display = "none"; 
    }
  });
}
  
// 點擊儀表板時觸發的過濾器
function filterByDashboard(type) {
  const rows = document.querySelectorAll("#taskTableBody tr");
  
  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;
    
    const status = row.getAttribute("data-status");
    const isUrgent = row.getAttribute("data-urgent");
    
    if (type === '急件' && isUrgent === 'yes') row.style.display = "";
    else if (type === '待處理' && status.includes('待處理')) row.style.display = "";
    else if (type === '進行中' && status.includes('進行中')) row.style.display = "";
    else if (type === '卡關' && (status.includes('卡關') || status.includes('等回覆'))) row.style.display = "";
    else row.style.display = "none";
  });
}

// 1. 打開或關閉指定的下拉選單
function toggleDropdown(menuId) {
  // 先把其他所有選單關掉，再切換點擊的這個
  const allMenus = ['statusMenu', 'categoryMenu', 'vendorMenu', 'assigneeMenu'];
  allMenus.forEach(id => {
    if (id !== menuId) document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(menuId).classList.toggle('hidden');
}

// 2. 通用的：更新按鈕上的「已選數量」文字
function updateDropdownBtn(type, labelName) {
  const checkboxes = document.querySelectorAll(`.filter-${type}-cb`);
  const checkedBoxes = document.querySelectorAll(`.filter-${type}-cb:checked`);
  const btnText = document.getElementById(`${type}BtnText`);
  
  if (checkedBoxes.length === checkboxes.length) {
    btnText.textContent = `${labelName} (全部)`;
  } else if (checkedBoxes.length === 0) {
    btnText.textContent = `${labelName} (未選)`;
  } else {
    btnText.textContent = `${labelName} (已選 ${checkedBoxes.length})`;
  }
}

// 3. 通用的：全選 / 清除功能
function selectAllOptions(type, labelName) {
  const checkboxes = document.querySelectorAll(`.filter-${type}-cb`);
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  
  checkboxes.forEach(cb => cb.checked = !allChecked);
  updateDropdownBtn(type, labelName);
  applyFilter();
}

// 4. 點擊網頁其他空白處，自動收起所有下拉選單
document.addEventListener('click', function(event) {
  const dropdowns = ['status', 'category', 'vendor', 'assignee'];
  dropdowns.forEach(type => {
    const wrap = document.getElementById(`${type}Dropdown`);
    const menu = document.getElementById(`${type}Menu`);
    // 如果點擊的地方不在該選單範圍內，就把它隱藏
    if (wrap && !wrap.contains(event.target)) {
      menu.classList.add('hidden');
    }
  });
});

// 🔍 5. 更新為支援四組陣列的 applyFilter
function applyFilter() {
  // 抓取四大過濾器中「有被打勾」的值，存成陣列
  const checkedStatuses = Array.from(document.querySelectorAll('.filter-status-cb:checked')).map(cb => cb.value);
  const checkedCategories = Array.from(document.querySelectorAll('.filter-category-cb:checked')).map(cb => cb.value);
  const checkedVendors = Array.from(document.querySelectorAll('.filter-vendor-cb:checked')).map(cb => cb.value);
  const checkedAssignees = Array.from(document.querySelectorAll('.filter-assignee-cb:checked')).map(cb => cb.value);

  const rows = document.querySelectorAll("#taskTableBody tr");

  rows.forEach(row => {
    if (row.innerText.includes("目前沒有任何案件")) return;

    const statusText = row.querySelector("td:nth-child(1) span").textContent;
    const categoryText = row.querySelector("td:nth-child(2)").textContent;
    const vendorText = row.querySelector("td:nth-child(3)").textContent; 
    const assigneeText = row.querySelector("td:nth-child(5)").textContent; 

    // 比對文字是否存在於被勾選的陣列中
    const matchStatus = checkedStatuses.some(status => statusText.includes(status));
    const matchCategory = checkedCategories.includes(categoryText);
    const matchVendor = checkedVendors.includes(vendorText);
    const matchAssignee = checkedAssignees.includes(assigneeText);

    // 四個條件都符合才顯示
    if (matchStatus && matchCategory && matchVendor && matchAssignee) {
      row.style.display = ""; 
    } else {
      row.style.display = "none"; 
    }
  });
}
