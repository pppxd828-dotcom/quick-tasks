
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專屬雜事追蹤管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; background-color: #f1f5f9; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="text-slate-800 min-h-screen">

<!-- 頂部導覽列 -->
<header class="bg-[#1e293b] text-white shadow-md sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="bg-blue-500 p-1.5 rounded-lg">🛡️</div>
      <h1 class="text-lg font-bold tracking-wider">專屬雜事追蹤管理系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="userStatus" class="text-xs text-slate-300"></span>
      <button id="loginBtn" class="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 transition">☁️ 雲端同步登入</button>
      <button id="logoutBtn" class="hidden px-4 py-2 rounded-md bg-slate-700 text-slate-200 text-sm font-bold hover:bg-slate-600 transition">登出</button>
      <button id="openModalBtn" class="hidden px-4 py-2 rounded-md bg-emerald-500 text-white text-sm font-bold hover:bg-emerald-600 transition shadow-sm">+ 新增案件</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 mt-6">
  
  <!-- 四大狀態卡片 (儀表板) -->
  <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-500 text-2xl">🚨</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">今日急件</p>
        <p class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center text-amber-500 text-2xl">📥</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">待處理清單</p>
        <p class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-2xl">🏃</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">處理/盤點中</p>
        <p class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center text-purple-500 text-2xl">🤝</div>
      <div>
        <p class="text-sm text-slate-500 font-bold">卡關/等回覆</p>
        <p class="text-2xl font-black text-slate-700">0</p>
      </div>
    </div>
  </section>

  <!-- 案件資料表區域 -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <div class="flex gap-2">
        <select class="border border-slate-300 rounded-md px-3 py-1.5 text-sm font-medium focus:ring-blue-500"><option>全部狀態</option></select>
        <select class="border border-slate-300 rounded-md px-3 py-1.5 text-sm font-medium focus:ring-blue-500"><option>全部類別</option></select>
      </div>
      <button class="px-3 py-1.5 text-sm font-bold text-emerald-600 bg-emerald-50 rounded-md hover:bg-emerald-100">📥 匯出 Excel</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-white text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200">
            <th class="px-6 py-4 font-bold">狀態</th>
            <th class="px-6 py-4 font-bold">專案類別</th>
            <th class="px-6 py-4 font-bold">聯絡人</th>
            <th class="px-6 py-4 font-bold">任務來源</th>
            <th class="px-6 py-4 font-bold">任務摘要</th>
            <th class="px-6 py-4 font-bold">死線</th>
            <th class="px-6 py-4 font-bold">最後更新</th>
            <th class="px-6 py-4 font-semibold text-center">操作</th>
          </tr>
        </thead>
        <tbody id="taskTableBody" class="text-sm divide-y divide-slate-100">
          <tr>
            <td colspan="6" class="px-6 py-10 text-center text-slate-400">請先登入以載入資料...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- 新增案件 Modal 表單 -->
<div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center">
  <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h2 class="text-lg font-bold text-slate-800">新增追蹤案件</h2>
      <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
    </div>
    <div class="p-6 grid grid-cols-2 gap-4">
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">專案類別 (來自 Google Sheets)</label>
        <select id="categorySelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">聯絡人 (來自 Google Sheets)</label>
        <select id="contactSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
        </select>
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務來源 (來自 Google Sheets)</label>
        <select id="taskSource" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
          <option value="">載入中...</option>
       </select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-500 mb-1">任務摘要</label>
        <input type="text" id="taskTitle" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-blue-500" placeholder="一句話描述這個任務...">
      </div>
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-500 mb-1">詳細說明與網址</label>
        <textarea id="taskDetails" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 resize-none" placeholder="貼上表單連結、錯誤訊息或備註..."></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
      <button id="cancelBtn" class="px-4 py-2 rounded-lg text-slate-600 font-bold hover:bg-slate-200 text-sm">取消</button>
      <button id="saveTaskBtn" class="px-5 py-2 rounded-lg bg-blue-600 text-white font-bold hover:bg-blue-700 text-sm shadow-sm">儲存案件</button>
      <button class="px-5 py-2 rounded-lg bg-blue-600 text-white font-bold hover:bg-blue-700 text-sm shadow-sm">儲存案件</button>
    </div>
  </div>
</div>

<script>
/* === 請換成你的 Client ID === */
const CLIENT_ID = "370645265767-phukpstpp7prf0ioh2tt6khc6dchk015.apps.googleusercontent.com";
// 擴充權限：加入 Google Sheets API 的讀寫權限
const SCOPES = "https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/spreadsheets"; 
// 你提供的 Spreadsheet ID
const SPREADSHEET_ID = "1Q7ncYV9-a_Vl54spHHH96x_FunVlf15QNLIbARJahq4";

let accessToken = null;
let tokenClient = null;

// Modal 控制邏輯
const modal = document.getElementById("taskModal");
document.getElementById("openModalBtn").addEventListener("click", () => modal.classList.remove("hidden"));
document.getElementById("closeModalBtn").addEventListener("click", () => modal.classList.add("hidden"));
document.getElementById("cancelBtn").addEventListener("click", () => modal.classList.add("hidden"));

window.addEventListener("load", () => {
  // 1. 網頁載入時，先去 localStorage 找找看有沒有之前存下來的 Token
  const savedToken = localStorage.getItem("google_access_token");
  if (savedToken) {
    accessToken = savedToken;
    setLoggedInUI(true);
    loadSettingsFromSheets();
    loadTasksFromSheets();
  }

  // 2. 初始化 Google 登入客戶端
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error) return alert("登入失敗：" + resp.error);
      accessToken = resp.access_token;
      
      // 💡 關鍵新增：登入成功後，把 Token 存進瀏覽器！
      localStorage.setItem("google_access_token", accessToken);
      
      setLoggedInUI(true);
      loadSettingsFromSheets();
      loadTasksFromSheets();
    },
  });

  // 3. 綁定按鈕
  document.getElementById("loginBtn").addEventListener("click", () => tokenClient.requestAccessToken({ prompt: "consent" }));
  
  document.getElementById("logoutBtn").addEventListener("click", () => {
    // 💡 關鍵新增：登出時，把瀏覽器裡的 Token 刪掉
    localStorage.removeItem("google_access_token");
    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => { 
        accessToken = null; 
        setLoggedInUI(false); 
      });
    } else {
      setLoggedInUI(false);
    }
  });
});

function setLoggedInUI(loggedIn) {
  document.getElementById("loginBtn").classList.toggle("hidden", loggedIn);
  document.getElementById("logoutBtn").classList.toggle("hidden", !loggedIn);
  document.getElementById("openModalBtn").classList.toggle("hidden", !loggedIn);
  document.getElementById("userStatus").textContent = loggedIn ? "✅ 已連線至資料庫" : "";
}

// 核心功能：從 Google Sheets 抓取自訂選項
async function loadSettingsFromSheets() {
  try {
    // 1. 同時發送三個請求，抓取類別、聯絡人，以及新增的「任務來源」(假設在 G 欄)
    const [catRes, contactRes, sourceRes] = await Promise.all([
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!A2:A`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!C2:E`, { headers: { Authorization: `Bearer ${accessToken}` } }),
      fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/系統設定!G2:G`, { headers: { Authorization: `Bearer ${accessToken}` } }) // 新增這行抓取 G 欄
    ]);

    const catData = await catRes.json();
    const contactData = await contactRes.json();
    const sourceData = await sourceRes.json(); // 解析任務來源資料

    // 2. 更新「專案類別」選單
    const catSelect = document.getElementById("categorySelect");
    catSelect.innerHTML = '<option value="">請選擇...</option>';
    if (catData.values) {
      catData.values.forEach(row => {
        if(row[0]) catSelect.innerHTML += `<option value="${row[0]}">${row[0]}</option>`;
      });
    }

    // 3. 更新「聯絡人」選單
    const contactSelect = document.getElementById("contactSelect");
    contactSelect.innerHTML = '<option value="">請選擇...</option>';
    if (contactData.values) {
      contactData.values.forEach(row => {
        if(row[0]) {
          const ext = row[1] ? ` (分機: ${row[1]})` : '';
          contactSelect.innerHTML += `<option value="${row[0]}">${row[0]}${ext}</option>`;
        }
      });
    }

    // 4. 更新「任務來源」選單 (新加入的邏輯)
    const sourceSelect = document.getElementById("taskSource");
    sourceSelect.innerHTML = '<option value="">請選擇...</option>';
    if (sourceData.values) {
      sourceData.values.forEach(row => {
        if(row[0]) sourceSelect.innerHTML += `<option value="${row[0]}">${row[0]}</option>`;
      });
    }

    console.log("✅ 系統設定載入成功！");
  } catch (error) {
    console.error("載入設定失敗:", error);
    alert("讀取試算表失敗，請確定你有建立『系統設定』分頁，並且欄位名稱正確。");
  }
}
// 綁定儲存按鈕的點擊事件
document.getElementById("saveTaskBtn").addEventListener("click", saveTaskToSheets);

async function saveTaskToSheets() {
  if (!accessToken) return alert("請先登入！");

  const category = document.getElementById("categorySelect").value;
  const contact = document.getElementById("contactSelect").value;
  const source = document.getElementById("taskSource").value; // 1. 抓取任務來源
  const title = document.getElementById("taskTitle").value;
  const details = document.getElementById("taskDetails").value;
  
  if (!title) return alert("任務摘要不能是空的喔！");

  const now = new Date().toLocaleString('zh-TW');
  
  // 2. 依照試算表的 A~I 欄位順序排好陣列
  const rowData = [
    "待處理",   // A
    category,   // B
    contact,    // C
    source,     // D (新加入的任務來源)
    title,      // E
    details,    // F
    "",         // G (死線)
    now,        // H (建立時間)
    now         // I (最後更新)
  ];

  try {
    // 3. 注意這裡的範圍從 A:H 改成了 A:I
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/案件總表!A:I:append?valueInputOption=USER_ENTERED`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ values: [rowData] })
    });

    const result = await response.json();
    
    if (result.updates) {
      alert("✅ 案件儲存成功！");
      document.getElementById("taskSource").value = ""; // 清空新增的欄位
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDetails").value = "";
      modal.classList.add("hidden");

      loadTasksFromSheets(); // 儲存成功後自動重新整理表格！
    } else {
      console.error("儲存失敗:", result);
    }
  } catch (error) {
    console.error("發生錯誤:", error);
  }
}
// 核心功能：從 Google Sheets 讀取案件總表並顯示在畫面上
async function loadTasksFromSheets() {
  try {
    // 💡 抓取範圍延伸到 J 欄
    const range = encodeURIComponent("案件總表!A2:J");
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}`, {
      headers: { Authorization: `Bearer ${accessToken}` },
      cache: "no-store" 
    });
    
    if (response.status === 401) {
      alert("⚠️ 登入憑證已過期，請重新登入！");
      localStorage.removeItem("google_access_token");
      setLoggedInUI(false);
      return;
    }

    const data = await response.json();
    const tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = ""; 

    if (!data.values || data.values.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-10 text-center text-slate-400 font-bold">目前沒有任何案件，太棒了！🎉</td></tr>';
      return;
    }

    // 💡 關鍵：先將每一列綁上它在試算表中的「真實列數」(A2是第2列，所以 index + 2)
    const rowsWithIndex = data.values.map((row, index) => ({ rowData: row, rowIndex: index + 2 }));
    
    // 過濾掉空白列
    const validRows = rowsWithIndex.filter(item => item.rowData.length > 0 && item.rowData[0] !== "");
    const rows = validRows.reverse(); // 反轉讓最新的在最上面
    
    let urgentCount = 0, todoCount = 0, doingCount = 0, waitingCount = 0;
    
    rows.forEach(item => {
      const row = item.rowData;
      const rowIndex = item.rowIndex; // 這筆資料在試算表裡的真實列數
      
      const status = row[0] || "未定";
      
      // 💡 軟刪除邏輯：如果狀態是「已作廢」，直接跳過這筆不畫在網頁上！
      if (status === "已作廢") return;

      const category = row[1] || "無類別";
      const contact = row[2] || "無聯絡人";
      const source = row[3] || "無來源";
      const title = row[4] || "無摘要";
      const deadline = row[6] || "";
      const lastUpdate = row[8] || row[7] || "無時間"; 
      const historyLog = row[9] || ""; // 抓取 J 欄的處理歷程
      
      // 統計邏輯
      if (status.includes("待處理")) todoCount++;
      if (status.includes("進行中")) doingCount++;
      if (status.includes("卡關") || status.includes("等回覆")) waitingCount++;
      if (deadline !== "" && !status.includes("結案")) urgentCount++; 

      let statusColor = "bg-slate-100 text-slate-600";
      if (status.includes("待處理")) statusColor = "bg-amber-100 text-amber-700";
      else if (status.includes("進行中")) statusColor = "bg-blue-100 text-blue-700";
      else if (status.includes("結案")) statusColor = "bg-emerald-100 text-emerald-700";

      // 防止對話紀錄裡的換行符號弄壞 HTML，先把它編碼起來
      const logEncoded = encodeURIComponent(historyLog);

      // 💡 畫出畫面，並在最右邊新增「操作按鈕」，把列數和資料傳進去
      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-0">
          <td class="px-6 py-3"><span class="px-2 py-1 rounded-md text-xs font-bold ${statusColor}">${status}</span></td>
          <td class="px-6 py-3 font-medium text-slate-700">${category}</td>
          <td class="px-6 py-3 text-slate-600">${contact}</td>
          <td class="px-6 py-3 text-slate-400 text-xs">${source}</td>
          <td class="px-6 py-3 font-bold text-slate-800">${title}</td>
          <td class="px-6 py-3 text-rose-500 font-medium text-sm">${deadline || "-"}</td>
          <td class="px-6 py-3 text-xs text-slate-400">${lastUpdate}</td>
          <td class="px-6 py-3 text-center space-x-2">
            <button onclick="changeStatus(${rowIndex}, '${status}', '${logEncoded}')" class="text-blue-500 hover:text-blue-700 text-sm font-bold transition">✏️ 狀態</button>
            <button onclick="deleteTask(${rowIndex}, '${logEncoded}')" class="text-rose-500 hover:text-rose-700 text-sm font-bold transition">🗑️ 刪除</button>
          </td>
        </tr>
      `;
    });
    
    if (document.getElementById("countUrgent")) document.getElementById("countUrgent").textContent = urgentCount;
    if (document.getElementById("countTodo")) document.getElementById("countTodo").textContent = todoCount;
    if (document.getElementById("countDoing")) document.getElementById("countDoing").textContent = doingCount;
    if (document.getElementById("countWaiting")) document.getElementById("countWaiting").textContent = waitingCount;

  } catch (error) {
    console.error("❌ 載入案件時發生致命錯誤:", error);
  }
}
// 🟢 點擊「✏️ 狀態」按鈕時觸發
async function changeStatus(rowIndex, currentStatus, logEncoded) {
  const newStatus = prompt(`目前狀態是「${currentStatus}」\n請輸入新的狀態 (例如：進行中、等回覆、結案)：`, currentStatus);
  
  // 如果使用者按取消，或沒有改變狀態，就什麼都不做
  if (!newStatus || newStatus === currentStatus) return;
  
  await updateSheetData(rowIndex, newStatus, decodeURIComponent(logEncoded));
}

// 🔴 點擊「🗑️ 刪除」按鈕時觸發
async function deleteTask(rowIndex, logEncoded) {
  const confirmDelete = confirm("⚠️ 確定要刪除這筆案件嗎？\n(案件將會被標記為「已作廢」並從此列表中隱藏)");
  if (!confirmDelete) return;
  
  await updateSheetData(rowIndex, "已作廢", decodeURIComponent(logEncoded));
}

// ⚙️ 核心 API 呼叫：負責把更新的狀態、時間、日誌寫回 Google Sheets
async function updateSheetData(rowIndex, newStatus, currentLog) {
  try {
    // 1. 產生當下的時間戳記
    const now = new Date();
    const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    
    // 2. 組合處理歷程紀錄
    const newLogEntry = `[${timeString}] 變更為：${newStatus}`;
    const updatedLog = currentLog ? `${currentLog}\n${newLogEntry}` : newLogEntry;

    // 3. 打包要更新的資料 (使用 batchUpdate 可以一次更新多個不連續的欄位)
    // 我們要更新：A欄(狀態)、I欄(最後更新時間)、J欄(處理歷程)
    const body = {
      valueInputOption: "USER_ENTERED",
      data: [
        { range: `案件總表!A${rowIndex}`, values: [[newStatus]] },
        { range: `案件總表!I${rowIndex}:J${rowIndex}`, values: [[timeString, updatedLog]] }
      ]
    };

    // 4. 發送請求給 Google Sheets
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchUpdate`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${accessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      alert("✅ 案件狀態更新成功！");
      loadTasksFromSheets(); // 重新載入畫面，讓畫面立刻反映最新結果
    } else {
      const err = await response.json();
      alert("❌ 更新失敗：" + err.error.message);
    }
  } catch (error) {
    console.error("更新發生錯誤:", error);
    alert("❌ 網路錯誤或系統異常，請查看 Console。");
  }
}
</script>
</body>
</html>
